# Pre-commit hooks for scientific-computing-system
#
# Install once after cloning:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# CI also runs these same checks (in tests.yml) so the hooks are
# only required locally to catch issues before pushing.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

# Type checking is deliberately NOT a hook. mypy needs a real environment: the
# hook runs in an isolated venv where the optional-extra stubs are missing, so
# `cds/data_analysis/pandas_io.py` fails on absent pandas stubs, and supplying
# `pandas-stubs` instead drags in numpy's `.pyi` files, which use PEP 695
# `type` statements that mypy rejects under this project's
# `python_version = "3.10"` target (see issue #62).
#
# It is covered where it works properly instead:
#   * CI: the `test` matrix runs `mypy src/` and `mypy tests/` after installing
#     every extra, and the `property-tests` job owns the hypothesis file.
#   * Locally: `mypy src/` in your dev environment, which has the extras.
#
# tests.yml used to pass `SKIP: mypy` to this hook set for exactly this reason.
