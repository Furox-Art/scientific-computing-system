# Hash-locked Python 3.12 release-build and artifact-validation environment.
# Regenerate deliberately; release.yml installs this file with --require-hashes
# and --only-binary=:all:, then runs `python -m build --no-isolation` and
# `python -m twine check --strict`.
#
# `twine` is pinned here, not on the command line, for a concrete reason:
# `--require-hashes` refuses any requirement that is not itself hash-pinned, so
# `pip install --require-hashes -r requirements-build.lock twine==7.0.0` fails
# with "Hashes are required in --require-hashes mode". The pin has to live in
# this file to be hash-verified at all.
#
# Why twine is pinned to exactly 7.0.0 rather than left floating: twine <= 6.2.0
# replaces `packaging.metadata._VALID_METADATA_VERSIONS` at import time with a
# hardcoded list ending at 2.4, discarding packaging's own knowledge of 2.5+.
# `twine check --strict` then rejects a perfectly valid artifact with
# `InvalidDistribution: '2.5' is not a valid metadata version`. twine 7.0.0
# removed the override and defers to packaging. Verified here:
#   twine 6.2.0 + Metadata-Version 2.5 -> ERROR InvalidDistribution
#   twine 7.0.0 + Metadata-Version 2.5 -> PASSED
# scripts/check_release_toolchain.py enforces the pin/metadata-version
# relationship so this cannot silently regress.
