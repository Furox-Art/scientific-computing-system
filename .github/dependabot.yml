version: 2
# NOTE: `commit-message` is an object with a `prefix` key. A bare
# `commit-message-prefix` is not in the schema, and Dependabot rejects the
# WHOLE file when it meets an unknown key — which is why this repo had never
# produced a single Dependabot PR or run despite being configured since day one,
# and why its actions had drifted up to three majors behind.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # The three CodeQL steps (init/autobuild/analyze) share one commit SHA per
    # release and must be bumped together — mixing versions makes the scan fail:
    #   "Loaded a configuration file for version '3.37.9', but running version '4.37.9'"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - minor
          - patch
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      routine-python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
