name: Public external validation P08 first BOLD

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p08-first-bold.yml'
      - 'tools/public_external_validation_p08_first_bold.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Acquire exact P08 first raw BOLD
        id: acquire
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p08_first_bold.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show result
        if: always()
        run: cat .public-runner/p08/first_bold_exact_acquisition.json
      - name: Upload compact result and verified binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-first-bold-exact
          retention-days: 7
          if-no-files-found: warn
          path: |
            .public-runner/p08/first_bold_exact_acquisition.json
            .public-runner/p08/sub-Bubbles_ses-01_task-SORPF_run-1_echo-1_part-mag_bold.nii.gz
      - name: Fail if exact acquisition failed
        if: always()
        run: test "${{ steps.acquire.outputs.exit_code }}" = "0"
