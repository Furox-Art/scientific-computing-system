name: Public external validation P10 cellwise crosscheck

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p10-cellwise.yml'
      - 'tools/public_external_validation_p10_cellwise.py'
      - 'tools/public_p10_crossdecoding_manifest.csv'
      - 'tools/public_p10_source_bf_manifest.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests numpy scipy
      - name: Run cellwise exact crosscheck
        id: verify
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p10_cellwise.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show aggregate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.public-runner/p10/cellwise/cellwise_source_array_crosscheck.json'))
          print(json.dumps({'status':x.get('status'),'aggregate':x.get('aggregate'),'error':x.get('error')},indent=2))
          PY
      - name: Upload compact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p10-cellwise-crosscheck
          retention-days: 14
          if-no-files-found: warn
          path: .public-runner/p10/cellwise/cellwise_source_array_crosscheck.json
      - name: Fail if crosscheck failed
        if: always()
        run: test "${{ steps.verify.outputs.exit_code }}" = "0"
