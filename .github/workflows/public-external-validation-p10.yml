name: Public external validation P10

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p10.yml'
      - 'tools/public_external_validation_p10.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests scipy h5py

      - name: Acquire and verify exact public P10 binary
        id: acquire
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p10.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show result
        if: always()
        run: cat .public-runner/p10/result.json

      - name: Upload binary and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p10-sub01-exact
          if-no-files-found: warn
          retention-days: 14
          path: |
            .public-runner/p10/sub-01_task-touchdecoding_crossdecoding.mat
            .public-runner/p10/result.json

      - name: Commit result JSON to public runner branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .public-runner/p10/result.json
          if git diff --cached --quiet; then
            echo 'No result change.'
          else
            git commit -m 'Record public P10 acquisition result'
            git push origin HEAD:external-validation-public-runner-20260918
          fi

      - name: Fail if verification failed
        if: always()
        run: test "${{ steps.acquire.outputs.exit_code }}" = "0"
