name: PyPI Release Policy

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/pypi-release-policy.yml"
      - "scripts/verify_release_integrity.py"
  workflow_dispatch:

# Default-deny; the policy job below declares exactly the scopes it needs.
permissions:
  contents: read

concurrency:
  group: pypi-release-policy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

# PyPI download statistics count every fetched distribution file, including
# files fetched by CI. This workflow therefore reads the public PyPI JSON API
# only and never installs or downloads the released distribution.
jobs:
  github-release-policy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: enforce distribution-free GitHub Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve the source commit
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            # This workflow triggers on the Release workflow, which normally is
            # itself a workflow_run consumer, so the triggering run's event is
            # `workflow_run`. The Release recovery path is dispatched manually
            # and never publishes to PyPI, so a `workflow_dispatch` run is
            # accepted too. The Release gate already verified its own upstream
            # CI run through the Actions API; here we only need to prove the
            # trigger came from this repository's Release workflow on the
            # default branch before trusting its head SHA.
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.head_sha, .event, .head_branch, .conclusion, .repository.full_name, .path] | @tsv')"
            IFS=$'\t' read -r sha event branch conclusion repo path <<<"${data}"
            case "${event}" in
              workflow_run|workflow_dispatch) ;;
              *)
                echo "::error::Run ${RUN_ID} has unsupported event ${event}."
                exit 1
                ;;
            esac
            if [ "${path}" != ".github/workflows/release.yml" ] || \
               [ "${branch}" != "main" ] || \
               [ "${conclusion}" != "success" ] || [ "${repo}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::Run ${RUN_ID} is not a successful Release run on ${GITHUB_REPOSITORY} main."
              exit 1
            fi
          else
            sha="${GITHUB_SHA}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The policy check also runs on a push that touches the release
      # workflow, which can land before the version has been released (the
      # 2.2.13 merge did exactly that). A missing release is not a policy
      # violation: there is nothing to check yet, and the workflow_run trigger
      # re-runs this job after the Release workflow creates it.
      - name: Resolve matching GitHub Release
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id' 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$release_id"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $RELEASE_TAG does not exist yet; nothing to enforce."
          else
            echo "::error::Could not resolve GitHub Release $RELEASE_TAG: $release_id"
            exit 1
          fi

      - name: Remove forbidden wheel and sdist assets from matching GitHub Release
        if: steps.release_state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # sign-release.yml attaches <repository>-<tag>.tar.gz together with
          # its .sigstore bundle. Deleting the snapshot would leave the
          # signature bundle without the subject it attests, so that exact
          # file is kept; every other wheel and tarball is forbidden.
          snapshot="${GITHUB_REPOSITORY#*/}-${RELEASE_TAG}.tar.gz"
          asset_rows="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | [.id, .name] | @tsv'
          )"
          removed=0
          while IFS=$'\t' read -r asset_id asset_name; do
            if [ -z "$asset_id" ]; then
              continue
            fi
            if [ "$asset_name" = "$snapshot" ]; then
              echo "Keeping signed source snapshot $asset_name"
              continue
            fi
            case "$asset_name" in
              *.whl|*.tar.gz) ;;
              *) continue ;;
            esac
            echo "Deleting forbidden GitHub Release distribution asset $asset_name (id=$asset_id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            removed=$((removed + 1))
          done <<<"$asset_rows"
          if [ "$removed" -eq 0 ]; then
            echo "No forbidden distribution assets found on $RELEASE_TAG."
          fi

      - name: Verify public PyPI and distribution-free GitHub Release policy
        if: steps.release_state.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
