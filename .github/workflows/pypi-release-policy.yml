name: PyPI Release Policy

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/pypi-release-policy.yml"
      - "scripts/verify_release_integrity.py"
  workflow_dispatch:

# Default-deny; the policy job below declares exactly the scopes it needs.
permissions:
  contents: read

concurrency:
  group: pypi-release-policy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

# PyPI download statistics count every fetched distribution file, including
# files fetched by CI. This workflow therefore reads the public PyPI JSON API
# only and never installs or downloads the released distribution.
jobs:
  github-release-policy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: enforce metadata-only GitHub Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve the source commit
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.head_sha, .event, .head_branch, .conclusion, .repository.full_name] | @tsv')"
            IFS=$'\t' read -r sha event branch conclusion repo <<<"${data}"
            if [ "${event}" != "push" ] || [ "${branch}" != "main" ] || \
               [ "${conclusion}" != "success" ] || [ "${repo}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::Run ${RUN_ID} is not a successful push on ${GITHUB_REPOSITORY} main."
              exit 1
            fi
          else
            sha="${GITHUB_SHA}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The policy check also runs on a push that touches the release
      # workflow, which can land before the version has been released (the
      # 2.2.13 merge did exactly that). A missing release is not a policy
      # violation: there is nothing to check yet, and the workflow_run trigger
      # re-runs this job after the Release workflow creates it.
      - name: Resolve matching GitHub Release
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id' 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$release_id"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $RELEASE_TAG does not exist yet; nothing to enforce."
          else
            echo "::error::Could not resolve GitHub Release $RELEASE_TAG: $release_id"
            exit 1
          fi

      - name: Remove forbidden wheel and sdist assets from matching GitHub Release
        if: steps.release_state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | select((.name | endswith(".whl")) or (.name | endswith(".tar.gz"))) | .id'
          )"
          if [ -z "$asset_ids" ]; then
            echo "No forbidden distribution assets found on $RELEASE_TAG."
          else
            for asset_id in $asset_ids; do
              echo "Deleting forbidden GitHub Release distribution asset id=$asset_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
          fi

      - name: Verify public PyPI and asset-free GitHub Release policy
        if: steps.release_state.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
