name: Public external validation P08 V2 Self-Other GLM

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  participant-glm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        participant: [sub-Bubbles, sub-Buttercup, sub-PILOT02]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen GLM tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'nilearn==0.13.1' \
            'nipype==1.11.0' \
            'scipy>=1.11,<2'
          python - <<'PY'
          import nilearn, nipype
          assert nilearn.__version__ == '0.13.1'
          assert nipype.__version__ == '1.11.0'
          print('nilearn', nilearn.__version__)
          print('nipype', nipype.__version__)
          PY

      - name: Download exact V2 preprocessed participant artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Furox-Art/scientific-computing-system
          run-id: 35404439901
          name: public-p08-opensource-v2-preprocessed-${{ matrix.participant }}
          path: inputs/public-p08-opensource-v2-preprocessed-${{ matrix.participant }}

      - name: Download exact V2 preprocessing provenance artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Furox-Art/scientific-computing-system
          run-id: 35404439901
          name: public-p08-opensource-v2-preprocessing-provenance-${{ matrix.participant }}
          path: inputs/public-p08-opensource-v2-preprocessing-provenance-${{ matrix.participant }}

      - name: Download frozen res-02 Harvard-Oxford ROI artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Furox-Art/scientific-computing-system
          run-id: 35403999383
          name: public-p08-harvard-oxford-roi-preflight-v2-res02
          path: inputs/public-p08-harvard-oxford-roi-preflight-v2-res02

      - name: Verify input artifact presence before target model
        shell: bash
        run: |
          set -euo pipefail
          p="${{ matrix.participant }}"
          test -n "$(find "inputs/public-p08-opensource-v2-preprocessed-$p" -type f -name '*res-02_desc-optcom_bold.nii.gz' -print -quit)"
          test -n "$(find "inputs/public-p08-opensource-v2-preprocessing-provenance-$p" -type f -name 'input_reconstruction.json' -print -quit)"
          test -n "$(find inputs/public-p08-harvard-oxford-roi-preflight-v2-res02 -type f -name 'roi-FrontalMedialCortex_mask.nii.gz' -print -quit)"
          test -n "$(find inputs/public-p08-harvard-oxford-roi-preflight-v2-res02 -type f -name 'roi-CingulateGyrusPosterior_mask.nii.gz' -print -quit)"

      - name: Run frozen participant Self-Other GLM and ROI extraction
        shell: bash
        run: |
          set -euo pipefail
          p="${{ matrix.participant }}"
          python tools/public_external_validation_p08_v2_glm.py participant \
            --participant "$p" \
            --preproc-root "inputs/public-p08-opensource-v2-preprocessed-$p" \
            --prov-root "inputs/public-p08-opensource-v2-preprocessing-provenance-$p" \
            --roi-root "inputs/public-p08-harvard-oxford-roi-preflight-v2-res02" \
            --output-root "glm-output"

      - name: Upload participant GLM provenance
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-opensource-v2-glm-${{ matrix.participant }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            glm-output/${{ matrix.participant }}/participant_glm_result.json
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_contrast-SelfMinusOther_desc-equalRunMean_effect_size.nii.gz
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/contrast-SelfMinusOther_effect_size.nii.gz
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/design_matrix.tsv
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/confounds.tsv
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/motion_qc.tsv
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/events_model.tsv
            glm-output/${{ matrix.participant }}/${{ matrix.participant }}_ses-*_run-*/analysis_mask.nii.gz

  aggregate:
    needs: participant-glm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen aggregation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'nilearn==0.13.1' \
            'nipype==1.11.0' \
            'scipy>=1.11,<2'

      - name: Download participant GLM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: public-p08-opensource-v2-glm-*
          path: participant-glm-artifacts

      - name: Aggregate frozen participant-level ROI effects
        run: |
          set -euo pipefail
          python tools/public_external_validation_p08_v2_glm.py aggregate \
            --participant-results-root participant-glm-artifacts \
            --output-root group-output

      - name: Upload final secondary sensitivity result
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-opensource-v2-self-other-final
          retention-days: 30
          if-no-files-found: error
          path: |
            group-output/group_glm_roi_result.json
            group-output/participant_roi_effects.tsv
