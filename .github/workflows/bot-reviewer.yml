name: Bot Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  auto-approve-maintainer: "false"

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check App credentials configured
        id: cfg
        env:
          APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          if [[ -n "$APP_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_ID not set — Bot Reviewer inert."
          fi
      - name: Generate GitHub App token
        id: app-token
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Decide whether to approve
        id: gate
        if: steps.cfg.outputs.configured == 'true'
        env:
          ACTOR: ${{ github.actor }}
          MAINTAINER: "Furox-Art"
          AUTO_MAINTAINER: ${{ env.auto-approve-maintainer }}
        run: |
          approve="false"
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            approve="true"
          elif [[ "$AUTO_MAINTAINER" == "true" && "$ACTOR" == "$MAINTAINER" ]]; then
            approve="true"
          fi
          echo "approve=$approve" >> "$GITHUB_OUTPUT"
      - name: Submit approving review
        if: steps.gate.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body \
            "Automated approval by Bot Reviewer (actor: ${{ github.actor }}). CI/CodeQL still gate merge."
