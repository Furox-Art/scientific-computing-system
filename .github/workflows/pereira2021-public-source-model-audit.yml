name: Pereira 2021 Public Source Model Audit

on:
  push:
    branches: [pereira-source-audit-20260922]
    paths:
      - "tools/audit_pereira2021_source_model_direct_gitlab.py"
      - "tools/audit_pereira2021_nature_source_data.py"
      - ".github/workflows/pereira2021-public-source-model-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pereira-source-audit-20260922
          fetch-depth: 1

      - name: Audit pinned public source model
        run: python3 tools/audit_pereira2021_source_model_direct_gitlab.py

      - name: Install source-data parser
        run: python3 -m pip install openpyxl==3.1.5

      - name: Audit Nature source data
        run: python3 tools/audit_pereira2021_nature_source_data.py

      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pereira_audit/SOURCE_MODEL_SPEC_AUDIT_2026-09-22.json
          git add pereira_audit/NATURE_SOURCE_DATA_AUDIT_2026-09-22.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Pereira pinned source-model audit"
          git push origin HEAD:pereira-source-audit-20260922
