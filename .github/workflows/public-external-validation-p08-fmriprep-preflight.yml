name: Public external validation P08 fMRIPrep preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FS_LICENSE_TEXT: ${{ secrets.FS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918

      - name: Check frozen fMRIPrep container and FreeSurfer prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .public-runner/p08/fmriprep-preflight
          image='nipreps/fmriprep:22.0.0'
          docker pull "$image"
          export FMRIPREP_IMAGE="$image"
          export FMRIPREP_VERSION_OUTPUT="$(docker run --rm "$image" --version 2>&1 | tail -n 5 | tr '\n' ' ')"
          export FMRIPREP_IMAGE_DIGEST="$(docker inspect "$image" --format='{{index .RepoDigests 0}}')"
          python3 - <<'PY'
          import json, os
          present = bool(os.environ.get("FS_LICENSE_TEXT", ""))
          out = {
              "status": "P08_FMRIPREP_22_IMAGE_AND_FREESURFER_LICENSE_PREREQUISITES_PRESENT" if present else "P08_FMRIPREP_22_IMAGE_PRESENT_FREESURFER_LICENSE_SECRET_MISSING",
              "frozen_fmriprep_version": "22.0.0",
              "container_image": os.environ["FMRIPREP_IMAGE"],
              "container_digest": os.environ["FMRIPREP_IMAGE_DIGEST"],
              "version_command_output": os.environ["FMRIPREP_VERSION_OUTPUT"],
              "freesurfer_license_secret_name": "FS_LICENSE",
              "freesurfer_license_secret_present": present,
              "secret_value_logged": False,
              "data_download_started": False,
              "preprocessing_started": False,
              "neural_effect_computed": False,
              "scientific_note": "This preflight does not alter the frozen preprocessing lock. Do not substitute --fs-no-reconall when the FreeSurfer license is absent because the frozen primary source-consistent route specifies FreeSurfer bbregister 6 DOF."
          }
          path = ".public-runner/p08/fmriprep-preflight/preflight.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload compact preflight
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-fmriprep-preflight
          retention-days: 14
          if-no-files-found: error
          path: .public-runner/p08/fmriprep-preflight/preflight.json
