name: Sato 2018 locked direct ownership-agency reanalysis

on:
  push:
    branches:
      - direct-theory-test-raw-20260921
    paths:
      - "tools/analyze_sato2018_direct_ownership_agency.py"
      - ".github/workflows/sato2018-direct-ownership-agency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1
      - name: Run locked Sato reanalysis
        run: python tools/analyze_sato2018_direct_ownership_agency.py
      - name: Verify locked output
        run: |
          test -s sato2018_direct_reanalysis/result.json
          test -s sato2018_direct_reanalysis/provenance.json
          python - <<'PY'
          import json
          r=json.load(open("sato2018_direct_reanalysis/result.json"))
          assert r["source"]["sha256"]=="873336974dad77ea5b94cc8c9b17fcb0a2bd1c5a54ab05a970da649350b23f94"
          assert r["source"]["bytes"]==3497
          assert r["sample"]["n_participants"]==15
          assert r["sample"]["rows"]==60
          assert r["sample"]["additional_exclusions"]==0
          assert r["outcome_dependent_tuning"] is False
          print(r["primary"]["classification"])
          PY
      - name: Upload locked result
        uses: actions/upload-artifact@v4
        with:
          name: sato2018-locked-direct-ownership-agency
          path: |
            sato2018_direct_reanalysis/result.json
            sato2018_direct_reanalysis/provenance.json
            sato2018_direct_reanalysis/participant_primary_contrasts.csv
          retention-days: 30
