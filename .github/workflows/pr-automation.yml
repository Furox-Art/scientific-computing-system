name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run automation for'
        required: true
        type: string

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit-contract-migration:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'fix/repo-audit-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/repo-audit-hardening

      - name: Align evaluator tests with evidence-only lifecycle semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          mining = Path("tests/test_hypothesis_mining.py")
          text = mining.read_text(encoding="utf-8")
          text = text.replace(
              "    assert result.is_significant\n    assert hypo.status == HypothesisStatus.VALIDATED\n",
              "    assert result.is_significant\n"
              "    assert result.evidence_interpretation == \"supported\"\n"
              "    assert hypo.status == HypothesisStatus.TESTABLE\n",
              1,
          )
          mining.write_text(text, encoding="utf-8")

          edge = Path("tests/test_edge_quantum_evaluator_cli.py")
          text = edge.read_text(encoding="utf-8")
          text = text.replace(
              "    assert result.is_significant\n    assert hypo.status == HypothesisStatus.VALIDATED\n",
              "    assert result.is_significant\n"
              "    assert result.evidence_interpretation == \"supported\"\n"
              "    assert hypo.status == HypothesisStatus.NEW\n",
              1,
          )
          text = text.replace(
              "    assert not result.is_significant\n    assert hypo.status == HypothesisStatus.REJECTED\n",
              "    assert not result.is_significant\n"
              "    assert result.evidence_interpretation == \"inconclusive\"\n"
              "    assert hypo.status == HypothesisStatus.NEW\n",
              1,
          )
          paired = '''def test_evaluator_paired() -> None:
    hypo = _make_hypothesis()
    evaluator = HypothesisEvaluator()
    result = evaluator.evaluate(
        hypo,
        {"paired": ([1.0, 2.0, 3.0, 4.0], [10.0, 11.0, 12.0, 13.0])},
    )
    assert result.test_name == "Two-sample t-test"
    assert result.is_significant
'''
          text = text.replace(paired, paired.replace('"Two-sample t-test"', '"Paired t-test"'), 1)
          old_effect = '''def test_evaluator_paired_reports_cohens_d() -> None:
    # Paired path routes through compare_groups -> 2-sample t-test + Cohen's d
    hypo = _make_hypothesis()
    evaluator = HypothesisEvaluator()
    result = evaluator.evaluate(
        hypo,
        {"paired": ([1.0, 2.0, 3.0, 4.0], [10.0, 11.0, 12.0, 13.0])},
    )
    assert result.test_name == "Two-sample t-test"
    assert result.effect_size is not None
    assert result.effect_size_label == "Cohen's d"
'''
          new_effect = '''def test_evaluator_paired_reports_cohens_d() -> None:
    # Paired path reports the paired test and paired-standardized Cohen's dz.
    hypo = _make_hypothesis()
    evaluator = HypothesisEvaluator()
    result = evaluator.evaluate(
        hypo,
        {"paired": ([1.0, 2.0, 3.0, 4.0], [10.0, 11.0, 12.0, 13.0])},
    )
    assert result.test_name == "Paired t-test"
    assert result.effect_size is not None
    assert result.effect_size_label == "Cohen's dz"
'''
          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(
              "    # Reset status mutated by the single evaluate, then re-run in batch.\n",
              "    # Re-run an equivalent hypothesis in batch; lifecycle state is preserved.\n",
              1,
          )
          edge.write_text(text, encoding="utf-8")
          PY

          git diff --check
          if git diff --quiet -- tests/test_hypothesis_mining.py tests/test_edge_quantum_evaluator_cli.py; then
            echo "Evaluator test contracts already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_hypothesis_mining.py tests/test_edge_quantum_evaluator_cli.py
          git commit -m "test: align hypothesis evaluator semantics"
          git push origin HEAD:fix/repo-audit-hardening

  labeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  review-checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-review')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber = context.issue ? context.issue.number : null;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt('${{ inputs.pr_number }}');
            }

            if (!prNumber) {
              console.log('No PR number provided');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });

            const hasChecklist = comments.some(c =>
              c.body.includes('PR Review Checklist') && c.user.type === 'Bot'
            );

            if (hasChecklist) {
              console.log('Review checklist comment already exists');
              return;
            }

            const checklist = `## PR Review Checklist

            Maintainer quick checklist for this PR:

            - [ ] Tests added or updated where needed
            - [ ] Documentation updated (README, docstrings, examples)
            - [ ] No unnecessary dependencies added
            - [ ] Code follows project style (run ruff locally)
            - [ ] CHANGELOG updated if user-facing

            Feel free to ping the maintainer for review.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: checklist
            });

            console.log(`Posted review checklist for PR #${prNumber}`);
