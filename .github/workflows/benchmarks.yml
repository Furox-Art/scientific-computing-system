name: Benchmarks

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Benchmark execution itself is read-only. The only mutation path uses a
# short-lived GitHub App token passed directly to create-pull-request, so the
# workflow's default GITHUB_TOKEN never needs write scope.
permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate benchmark report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch (full history for SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]"

      - name: Run reproducible robust benchmarks
        run: python benchmarks/robust_runner.py

      - name: Verify artifacts changed
        id: changed
        run: |
          if git diff --quiet docs/benchmarks.md benchmarks/results.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check App credentials configured
        id: cfg
        env:
          APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          if [[ -n "$APP_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_ID not set — Benchmarks cannot open a PR."
          fi

      - name: Generate GitHub App token (triggers downstream CI)
        id: app-token
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Open PR with regenerated artifacts
        if: steps.changed.outputs.changed == 'true' && steps.cfg.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "ci(benchmarks): regenerate report and results.json"
          branch: ci/benchmark-regen
          title: "ci(benchmarks): regenerate report and results.json"
          body: |
            Automated benchmark regeneration from ${{ github.event_name }} trigger.

            - `docs/benchmarks.md`
            - `benchmarks/results.json`

            The JSON includes schema version, package/source identity, environment
            metadata, deterministic seed metadata, warmup policy, and median/MAD/p95
            timing distributions. No code changes.
          add-paths: |
            docs/benchmarks.md
            benchmarks/results.json
