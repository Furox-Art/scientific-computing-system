name: Public external validation P08 V2 run-sharded recovery

on:
  workflow_dispatch:
    inputs:
      anatomy_run_id:
        description: Exact successful P08 run-recovery anatomy run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  run-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - participant: sub-Bubbles
            session: ses-01
            run: 1
          - participant: sub-Bubbles
            session: ses-01
            run: 2
          - participant: sub-Bubbles
            session: ses-04
            run: 1
          - participant: sub-Bubbles
            session: ses-04
            run: 2
          - participant: sub-Buttercup
            session: ses-04
            run: 1
          - participant: sub-Buttercup
            session: ses-04
            run: 2
          - participant: sub-Buttercup
            session: ses-05
            run: 1
          - participant: sub-Buttercup
            session: ses-05
            run: 2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 218dc1ef15509a6d1e4db4fc8c5f1cf6ac140aaa

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests 'tedana==26.0.3' 'templateflow==25.1.2'
          python - <<'PY'
          import tedana,templateflow
          assert tedana.__version__=='26.0.3'
          assert templateflow.__version__=='25.1.2'
          PY

      - name: Install pinned ANTs 2.6.5
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ANTsX/ANTs/releases/download/v2.6.5/ants-2.6.5-ubuntu-24.04-X64-gcc.zip'
          expected='9f6a2c8881d6c94ea17171c0502e55cb898ad9afd50e4e23fde9a8c0997aa04b'
          curl -L --retry 4 --retry-delay 3 -o /tmp/ants.zip "$url"
          echo "$expected  /tmp/ants.zip" | sha256sum -c -
          unzip -q /tmp/ants.zip -d /tmp/ants
          rm -f /tmp/ants.zip
          bindir="$(find /tmp/ants -type f -name antsRegistration -printf '%h\n' | head -n1)"
          test -n "$bindir"
          libdir="$(dirname "$bindir")/lib"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$libdir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Pull exact AFNI image
        shell: bash
        run: |
          set -euo pipefail
          image='afni/afni_make_build@sha256:c8365868751116f1ef2d0811e8a4dd2df58a689da457c74ea07fedb0e11dc0d6'
          docker pull "$image"
          docker run --rm "$image" afni -ver | head -n 6

      - name: Download exact verified participant anatomy artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Furox-Art/scientific-computing-system
          run-id: ${{ inputs.anatomy_run_id }}
          name: public-p08-v2-run-recovery-anatomy-${{ matrix.participant }}
          path: inputs/anatomy

      - name: Reconstruct exact frozen session BIDS subset
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_external_validation_p08_sensitivity_prepare.py             --participant "${{ matrix.participant }}"             --session "${{ matrix.session }}"             --root .public-runner/p08/opensource-v2

      - name: Run one frozen SORPF run with reused anatomy
        id: preprocess
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p08_opensource_preprocess.py             --participant "${{ matrix.participant }}"             --session "${{ matrix.session }}"             --run "${{ matrix.run }}"             --anatomy-root inputs/anatomy
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify exact one-run outcome-free result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          p="${{ matrix.participant }}"
          s="${{ matrix.session }}"
          r="${{ matrix.run }}"
          result=".public-runner/p08/opensource-v2/$p/opensource_preprocessing_result.json"
          recon=".public-runner/p08/opensource-v2/$p/input_reconstruction.json"
          test -s "$result"
          test -s "$recon"
          python - "$result" "$recon" "$p" "$s" "$r" <<'PY'
          import json,sys
          result,recon,p,s,r=sys.argv[1:]
          r=int(r)
          d=json.load(open(result)); q=json.load(open(recon))
          assert d["status"]=="P08_OPEN_SOURCE_SECONDARY_PREPROCESSING_V2_RUN_SHARD_COMPLETE",d.get("status")
          assert d["participant"]==p and d.get("session_filter")==s and d.get("run_filter")==r
          assert d["expected_run_count"]==1 and d["mni_optcom_run_count"]==1
          assert d["sessions_expected"]=={s:[r]}
          assert d.get("precomputed_anatomy_reused") is True
          assert q["participant"]==p and q.get("session_filter")==s and q["all_exact_verified"] is True
          assert not d.get("self_other_glm_computed",False)
          assert not d.get("roi_effect_computed",False)
          assert not d.get("neural_effect_computed",False)
          print(json.dumps({
            "participant":p,"session":s,"run":r,
            "status":d["status"],"precomputed_anatomy_reused":True,
            "neural_effect_computed":False
          },indent=2))
          PY

      - name: Upload run-shard provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-v2-run-recovery-provenance-${{ matrix.participant }}-${{ matrix.session }}-run-${{ matrix.run }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/input_reconstruction.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing.log
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1w_N4.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_0GenericAffine.mat
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_1Warp.nii.gz
            inputs/anatomy/**/anatomy_result.json

      - name: Upload one-run GLM-relevant derivatives
        if: steps.preprocess.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-v2-run-recovery-preprocessed-${{ matrix.participant }}-${{ matrix.session }}-run-${{ matrix.run }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/mni/*_${{ matrix.session }}_task-SORPF_run-${{ matrix.run }}_space-MNI152NLin2009cAsym_res-02_desc-optcom_bold.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/bids/${{ matrix.participant }}/${{ matrix.session }}/func/*task-SORPF_run-${{ matrix.run }}_events.tsv
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/${{ matrix.session }}/results/dfile*.1D
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json

      - name: Fail if run preprocessing failed
        if: always()
        run: test "${{ steps.preprocess.outputs.exit_code }}" = "0"
