name: Public external validation P07 supplement

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p07-supplement.yml'
      - 'tools/public_external_validation_p07_supplement.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests python-docx

      - name: Download and scan supplement
        id: scan
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p07_supplement.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show compact result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.public-runner/p07/supplement_mapping_scan.json'))
          print(json.dumps({
            'status':x.get('status'),
            'bytes':x.get('bytes'),
            'sha256':x.get('sha256'),
            'mapping_row_count':x.get('mapping_row_count'),
            'relevant_paragraph_count':x.get('relevant_paragraph_count'),
            'tables':x.get('tables'),
            'error':x.get('error')
          },indent=2))
          PY

      - name: Upload supplement scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p07-supplement-scan
          if-no-files-found: warn
          retention-days: 14
          path: |
            .public-runner/p07/supplement_mapping_scan.json

      - name: Commit compact scan only
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .public-runner/p07/supplement_mapping_scan.json
          if git diff --cached --quiet; then
            echo 'No supplement scan change.'
          else
            git commit -m 'Record P07 supplement mapping scan'
            git push origin HEAD:external-validation-public-runner-20260918
          fi

      - name: Fail if scan failed
        if: always()
        run: test "${{ steps.scan.outputs.exit_code }}" = "0"
