name: Ciaunica 2024 locked direct DP-agency reanalysis

on:
  push:
    branches:
      - direct-theory-test-raw-20260921
    paths:
      - "tools/analyze_ciaunica2024_direct_dp_agency.py"
      - ".github/workflows/ciaunica2024-direct-dp-agency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 statsmodels==0.14.4 openpyxl==3.1.5
      - name: Run locked Ciaunica reanalysis
        run: python tools/analyze_ciaunica2024_direct_dp_agency.py
      - name: Verify locked output
        run: |
          test -s ciaunica2024_direct_reanalysis/result.json
          test -s ciaunica2024_direct_reanalysis/provenance.json
          python - <<'PY'
          import json
          r=json.load(open("ciaunica2024_direct_reanalysis/result.json"))
          assert r["sample"]["final_n"] == 93
          assert r["sample"]["group_counts"]["HIGH"] == 46
          assert r["sample"]["group_counts"]["LOW"] == 47
          assert r["source_files"]["Extraction_IB_NEW.csv"]["sha256"] == "bd1c16cd414ab265907371d72ab66daa78f957f9b0e11d97b4a2fd74517fb10f"
          assert r["source_files"]["GROUP.xlsx"]["sha256"] == "3070ed9bf3eba9c8111ca4558a9c56119687b0a108ac65faacb61a89a83e7f74"
          assert r["outcome_dependent_tuning"] is False
          print(r["primary_overall_agency"]["classification"])
          PY
      - name: Upload locked result
        uses: actions/upload-artifact@v4
        with:
          name: ciaunica2024-locked-direct-dp-agency
          path: |
            ciaunica2024_direct_reanalysis/result.json
            ciaunica2024_direct_reanalysis/provenance.json
            ciaunica2024_direct_reanalysis/analysis_sample_ids.csv
          retention-days: 30
