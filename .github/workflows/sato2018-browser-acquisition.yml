name: Sato 2018 browser raw acquisition

on:
  push:
    branches:
      - direct-theory-test-raw-20260921
    paths:
      - "tools/acquire_sato2018_browser.py"
      - ".github/workflows/sato2018-browser-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm Chrome
        run: |
          which google-chrome || which chromium || which chromium-browser
          google-chrome --version || chromium --version || chromium-browser --version
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Acquire Sato CSV through public browser flow
        run: python tools/acquire_sato2018_browser.py
      - name: Upload browser acquisition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sato2018-browser-acquisition
          path: sato2018_browser_acquisition/
          if-no-files-found: error
          retention-days: 30
