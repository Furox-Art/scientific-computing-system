name: consolidate-audit-once

on:
  push:
    branches:
      - fix/consolidated-scientific-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply verified audit overlap patches once'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/consolidated-scientific-audit
          fetch-depth: 0

      - name: Apply narrow verified overlap patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/cds/data_io/streaming.py",
              '''    if min_block_size > max_block_size:\n        raise ValueError("min_block_size must not exceed max_block_size")\n\n    source = Path(path)\n''',
              '''    if min_block_size > max_block_size:\n        raise ValueError("min_block_size must not exceed max_block_size")\n    if min_block_size > memory_budget_bytes:\n        raise ValueError("min_block_size must not exceed memory_budget_bytes")\n\n    source = Path(path)\n''',
          )
          replace_once(
              "src/cds/data_io/streaming.py",
              '''    if not delimiter:\n        raise ValueError("delimiter must not be empty")\n''',
              '''    if len(delimiter) != 1:\n        raise ValueError("delimiter must be exactly one character")\n''',
          )

          replace_once(
              "src/cds/sensitivity.py",
              '''    if relative_step <= 0 or absolute_step <= 0:\n        raise ValueError("relative_step and absolute_step must be positive")\n''',
              '''    if (\n        not math.isfinite(relative_step)\n        or relative_step <= 0\n        or not math.isfinite(absolute_step)\n        or absolute_step <= 0\n    ):\n        raise ValueError("relative_step and absolute_step must be positive and finite")\n''',
          )

          path = Path("src/cds/provenance/manifest.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def save_checkpoint(\n")
          end = text.index("\n\ndef load_checkpoint(", start)
          replacement = '''def save_checkpoint(\n    path: str | os.PathLike[str],\n    manifest: RunManifest,\n    state: dict[str, object],\n) -> None:\n    """Atomically save a JSON checkpoint and remove partial files on any failure."""\n    destination = Path(path)\n    destination.parent.mkdir(parents=True, exist_ok=True)\n    payload = {"manifest": manifest.to_dict(), "state": state}\n    temporary: Path | None = None\n    try:\n        with tempfile.NamedTemporaryFile(\n            mode="w",\n            encoding="utf-8",\n            dir=destination.parent,\n            prefix=f".{destination.name}.",\n            suffix=".tmp",\n            delete=False,\n        ) as handle:\n            temporary = Path(handle.name)\n            json.dump(payload, handle, indent=2, sort_keys=True, ensure_ascii=False)\n            handle.write("\\n")\n            handle.flush()\n            os.fsync(handle.fileno())\n        temporary.replace(destination)\n    except Exception:\n        if temporary is not None:\n            temporary.unlink(missing_ok=True)\n        raise\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run targeted regression tests
        run: |
          python -m pytest \
            tests/test_data_io.py \
            tests/test_provenance.py \
            tests/test_sensitivity.py \
            tests/test_audit_guard_coverage.py \
            tests/test_montecarlo.py \
            tests/test_quantum.py \
            tests/test_multi_qubit.py \
            tests/test_uncertainty.py \
            tests/test_units.py \
            -q

      - name: Commit verified consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cds/data_io/streaming.py src/cds/provenance/manifest.py src/cds/sensitivity.py
          git diff --cached --check
          git commit -m "fix: preserve hardening while applying scientific audit guards"
          git push origin HEAD:fix/consolidated-scientific-audit
