name: npm Publish  
  
on:  
  workflow_dispatch:  
  push:  
    branches: [main]  
    paths:  
      - "package.json"  
      - "index.js"  
      - "bin/**"  
  
concurrency:  
  group: npm-publish  
  cancel-in-progress: false  
  
permissions:  
  contents: read  
  
jobs:  
  publish:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-node@v4  
        with:  
          node-version: "20"  
          registry-url: "https://registry.npmjs.org"  
  
      - name: Publish to npm  
        run: npm publish --access public  
        env:  
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 
