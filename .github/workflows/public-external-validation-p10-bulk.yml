name: Public external validation P10 bulk

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p10-bulk.yml'
      - 'tools/public_external_validation_p10_bulk.py'
      - 'tools/public_p10_crossdecoding_manifest.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy scipy

      - name: Download 34 included MAT files, verify, parse, summarize
        id: bulk
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p10_bulk.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show compact bulk result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='.public-runner/p10/bulk/bulk_descriptive_result.json'
          x=json.load(open(p))
          print(json.dumps({
            'status':x.get('status'),
            'all_hash_verified':x.get('all_hash_verified'),
            'descriptive_groups':x.get('descriptive_groups'),
            'between_group':x.get('descriptive_between_group_global_mean_difference'),
            'first_struct_structure':x.get('first_struct_structure'),
            'error':x.get('error')
          },indent=2))
          PY

      - name: Upload bulk outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p10-bulk-34
          if-no-files-found: warn
          retention-days: 14
          path: |
            .public-runner/p10/bulk/bulk_descriptive_result.json
            .public-runner/p10/bulk/participant_descriptives.csv

      - name: Commit compact outputs only
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .public-runner/p10/bulk/bulk_descriptive_result.json .public-runner/p10/bulk/participant_descriptives.csv
          if git diff --cached --quiet; then
            echo 'No bulk output change.'
          else
            git commit -m 'Record P10 bulk exact descriptive reanalysis'
            git push origin HEAD:external-validation-public-runner-20260918
          fi

      - name: Fail if bulk stage failed
        if: always()
        run: test "${{ steps.bulk.outputs.exit_code }}" = "0"
