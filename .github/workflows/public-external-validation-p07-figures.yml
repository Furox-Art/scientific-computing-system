name: Public external validation P07 figures

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p07-figures.yml'
      - 'tools/public_external_validation_p07_figures.py'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests pillow
      - name: Extract supplement media
        id: extract
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p07_figures.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload extracted figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p07-supplement-figures
          if-no-files-found: warn
          retention-days: 2
          path: |
            .public-runner/p07/figure_manifest.json
            .public-runner/p07/figures/**
      - name: Fail if extraction failed
        if: always()
        run: test "${{ steps.extract.outputs.exit_code }}" = "0"
