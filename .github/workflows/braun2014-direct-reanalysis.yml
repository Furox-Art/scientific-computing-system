name: Braun 2014 locked direct reanalysis

on:
  push:
    branches:
      - direct-theory-test-raw-20260921
    paths:
      - "tools/analyze_braun2014_direct_theory.py"
      - ".github/workflows/braun2014-direct-reanalysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 pyreadstat==1.2.8 pandas==2.2.3
      - name: Run locked direct reanalysis
        run: python tools/analyze_braun2014_direct_theory.py
      - name: Verify result exists
        run: |
          test -s braun2014_direct_reanalysis/result.json
          test -s braun2014_direct_reanalysis/provenance.json
          python - <<'PY'
          import json
          r=json.load(open("braun2014_direct_reanalysis/result.json"))
          assert r["source"]["zip_sha256"]=="68a048dfcf0faca32bcea4dade99ca079c7d21c49c33766fbd6b46e61c441351"
          assert r["sample"]["n"]==25
          assert r["outcome_dependent_tuning"] is False
          print(r["primary_explicit"]["classification"])
          PY
      - name: Upload locked result
        uses: actions/upload-artifact@v4
        with:
          name: braun2014-locked-direct-reanalysis
          path: |
            braun2014_direct_reanalysis/result.json
            braun2014_direct_reanalysis/provenance.json
            braun2014_direct_reanalysis/participant_primary_contrasts.csv
          retention-days: 30
