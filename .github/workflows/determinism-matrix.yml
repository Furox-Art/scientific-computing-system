name: Determinism matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: ${{ matrix.os }} determinism matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
            requirements-dev.lock
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run determinism matrix
        run: >
          python scripts/determinism_matrix.py run
          --workload scripts/determinism_workload.py
          --out determinism-manifest-${{ matrix.os }}.json
          --seeds 0 12345 random
          --threads 1 4
          --locales inherit C
          --timezones UTC Europe/Istanbul
          --gate within-host
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-manifest-${{ matrix.os }}
          path: determinism-manifest-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Cross-OS digest comparison
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: determinism-manifest-*
          merge-multiple: true
          path: manifests
      - name: Compare manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(manifests/*.json)
          failures=0
          printf 'manifest files: %s\n' "${#files[@]}"
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::expected a manifest from every operating system, found ${#files[@]}"
            exit 1
          fi
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              left=$(basename "${files[$i]}" .json)
              right=$(basename "${files[$j]}" .json)
              echo "=== ${left} vs ${right} ==="
              if ! python scripts/determinism_matrix.py compare \
                "${files[$i]}" "${files[$j]}" --gate > "compare-${left}-${right}.json"; then
                failures=$((failures + 1))
                echo "::error::cross-OS determinism failed or could not be compared: ${left} vs ${right}"
              fi
            done
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} manifest pair(s) mismatched or could not be compared"
            exit 1
          fi
      - name: Write comparison summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          rows = [
              "| baseline | candidate | shared | identical | mismatches | errors |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for path in sorted(glob.glob("compare-*.json")):
              try:
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
                  if not isinstance(data, dict):
                      raise ValueError("compare report is not an object")
              except (OSError, ValueError) as error:
                  rows.append(f"| {path} | unreadable | - | False | - | {error} |")
                  continue
              baseline = (data.get("baseline_host") or {}).get("system", "unknown")
              candidate = (data.get("candidate_host") or {}).get("system", "unknown")
              mismatches = data.get("mismatches") or []
              errors = data.get("errors") or []
              rows.append(
                  f"| {baseline} | {candidate} | {data.get('shared_variants', 0)} | "
                  f"{data.get('identical', False)} | {len(mismatches)} | {len(errors)} |"
              )
          if len(rows) == 2:
              rows.append("| no comparison reports | - | 0 | False | 0 | 1 |")
          with open(
              os.environ.get("GITHUB_STEP_SUMMARY", os.devnull),
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write("## Cross-OS determinism\n\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          PY
