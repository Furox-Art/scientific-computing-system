name: Release

# Single publish authority for PyPI + GitHub release metadata.
#
# Normal path: bump synchronized package metadata, merge to main, and let the
# full CI workflow complete. This workflow starts only from a successful CI
# push run on main, binds itself to that exact tested commit, re-runs the
# version-discipline guard, builds using a hash-locked non-isolated toolchain,
# verifies the installed wheel, attests it, publishes via Trusted Publishing,
# and creates a metadata-only GitHub Release.
#
# All actions in the privileged publish job are pinned to immutable commit SHAs.
# Update those SHAs deliberately after reviewing upstream release notes.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Recovery-only path. It never publishes to PyPI: it tags an already-published
  # version and creates the metadata-only GitHub Release that the post-publish
  # step may have missed. Dispatching it for an unpublished version fails closed.
  workflow_dispatch:
    inputs:
      version:
        description: "Already-published version to tag, without the v prefix (e.g. 2.2.6)"
        required: true
        type: string
      release_sha:
        description: "Optional commit SHA for the tag; must be on main and contain that version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify successful main CI release candidate
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.candidate.outputs.release_sha }}
      should_release: ${{ steps.candidate.outputs.should_release }}
    steps:
      - name: Resolve and verify the triggering CI run
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '[.head_sha, .event, .head_branch, .conclusion, .repository.full_name] | @tsv')"
          IFS=$'\t' read -r sha event branch conclusion repo <<<"${data}"
          if [ "${event}" != "push" ] || [ "${branch}" != "main" ] || \
             [ "${conclusion}" != "success" ] || [ "${repo}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::Run ${RUN_ID} is not a successful push on ${GITHUB_REPOSITORY} main."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 2

      - name: Bind release to the exact CI-tested commit
        id: candidate
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$RELEASE_SHA" ]; then
            echo "::error::Checkout SHA $checked_out does not match CI head SHA $RELEASE_SHA."
            exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          should_release=false
          reason="CI-tested commit did not change src/cds/_version.py; no release required."
          if git rev-parse -q --verify "${RELEASE_SHA}^1" >/dev/null; then
            if ! git diff --quiet "${RELEASE_SHA}^1" "$RELEASE_SHA" -- src/cds/_version.py; then
              should_release=true
              reason="CI-tested commit changed src/cds/_version.py; release authorized."
            fi
          elif git ls-tree -r --name-only "$RELEASE_SHA" | grep -Fxq "src/cds/_version.py"; then
            should_release=true
            reason="Root commit contains src/cds/_version.py; release authorized."
          else
            reason="Root commit has no src/cds/_version.py; no release required."
          fi

          # Self-healing recovery: a version bump whose release never reached
          # PyPI must not stay stranded because a later commit is what finally
          # turned main CI green. Release the tree version whenever PyPI does
          # not serve it, regardless of which commit introduced it. The publish
          # job re-checks existence before uploading, so a false negative here
          # cannot produce a duplicate upload.
          if [ "$should_release" = false ]; then
            version="$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
            if ! curl --retry 2 --retry-delay 2 --retry-all-errors -sfL \
              "https://pypi.org/pypi/scientific-computing-system/${version}/json" > /dev/null; then
              should_release=true
              reason="tree version ${version} is not on PyPI; releasing it from this CI-tested commit."
            fi
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "$reason"

  publish:
    name: Build + verify + publish to PyPI + metadata-only GitHub Release
    needs: gate
    if: github.event_name == 'workflow_run' && needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write
      deployments: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history + tags: the version-discipline base must be the previous
          # *release*, not the parent commit.
          fetch-depth: 0
          # The tag step pushes an annotated tag with this token. contents:write
          # is granted at job level; persisting the credential is what makes the
          # push possible.
          persist-credentials: true

      - name: Re-verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$RELEASE_SHA" ]; then
            echo "::error::Publish checkout $checked_out does not match authorized SHA $RELEASE_SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The comparison base is the most recent release tag reachable from the
      # release commit, i.e. the previously published version. Using
      # `${RELEASE_SHA}^1` instead would compare only against the immediate
      # parent, so a release commit that happened to be a merge of several
      # commits (or a rebase tip) could ship a package change made in an earlier
      # commit with no version bump at all.
      - name: Resolve the previous release as the version-discipline base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          previous_tag=""
          while read -r tag; do
            [ -z "$tag" ] && continue
            tagged_version="${tag#v}"
            if [ "$tagged_version" != "$version" ]; then
              previous_tag="$tag"
              break
            fi
          # Sort by version, not tag creation date: tags backfilled for older
          # versions are created later, so -creatordate would pick e.g. v2.2.6
          # as the base for v2.2.13 and weaken the version-discipline diff.
          done < <(git tag --merged HEAD --sort=-v:refname --list 'v*')
          if [ -n "$previous_tag" ]; then
            base="$(git rev-list -n 1 "$previous_tag")"
            echo "Previous release: $previous_tag ($base)"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
            echo "No previous release tag reachable; using repository root $base"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Verify synchronized monotonic release metadata
        shell: bash
        run: python scripts/check_version_discipline.py --base-ref "${{ steps.base.outputs.ref }}"

      - name: Reject version metadata lockstep drift before publishing
        shell: bash
        run: python scripts/check_version_lockstep.py

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $tag from $RELEASE_SHA"

      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements-build.lock

      - name: Build sdist + wheel without dependency isolation
        run: python -m build --no-isolation

      # Validate the core metadata *rendered* from the artifacts, before anything
      # is uploaded. `check_version_lockstep.py` proves the version and name are
      # right; it does not prove the artifact is renderable at all. This is the
      # step that catches an unusable artifact while it is still local.
      #
      # The pin matters and is not cosmetic. twine <= 6.2.0 replaces
      # `packaging.metadata._VALID_METADATA_VERSIONS` at import time with a list
      # ending at 2.4, so it rejects a valid artifact with
      # `InvalidDistribution: '2.5' is not a valid metadata version` -- a release
      # failure with nothing wrong with the package. twine 7.0.0 (pinned in
      # requirements-build.lock) removed the override.
      - name: Validate artifact metadata renders
        run: python -m twine check --strict dist/*

      # Assert the *contents* of both artifacts before anything is published.
      # The version/name verification below proves the metadata says 2.1.0; this
      # proves the wheel actually ships `cds` with its `py.typed` marker and the
      # declared entry point, and that the sdist carries no build residue. A
      # wheel missing `py.typed` imports and runs perfectly while silently
      # degrading every downstream type checker.
      - name: Assert wheel and sdist contents
        run: python scripts/check_distribution_contents.py dist

      # Second fail-closed artifact gate: the built files must declare the same
      # version as every metadata source. Catches a stale `dist/` carried over
      # from a previous build in the workspace.
      - name: Assert built artifacts match the declared version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/check_version_lockstep.py --dist-dir dist

      - name: Verify package name and release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")
          if len(sdists) != 1:
              sys.exit(f"Expected exactly one sdist, found {len(sdists)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          expected_version = os.environ["EXPECTED_VERSION"]
          if package.get("Name") != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package.get('Name')!r}")
          if package.get("Version") != expected_version:
              sys.exit(
                  f"Package version mismatch: expected={expected_version!r}, "
                  f"built={package.get('Version')!r}"
              )

          expected_prefix = f"scientific_computing_system-{expected_version}/"
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          if not names or not all(
              name == expected_prefix.rstrip("/") or name.startswith(expected_prefix)
              for name in names
          ):
              sys.exit("sdist root directory does not match the release version")

          print(f"Package metadata verified: scientific-computing-system {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/verify_cli_install.py --expected-version "$EXPECTED_VERSION"

      - name: Attest verified runner-local build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Inspect existing public PyPI release for safe recovery
        id: pypi_state
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          project = "scientific-computing-system"
          version = os.environ["EXPECTED_VERSION"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          api_url = f"https://pypi.org/pypi/{project}/{version}/json"

          try:
              with urllib.request.urlopen(api_url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("already_published=false\n")
              print(f"PyPI {project} {version} does not exist yet; upload required.")
              raise SystemExit(0)

          remote = {}
          for item in payload.get("urls", []):
              if item.get("packagetype") not in {"bdist_wheel", "sdist"}:
                  continue
              filename = item["filename"]
              if filename in remote:
                  raise SystemExit(f"Duplicate PyPI artifact filename: {filename}")
              remote[filename] = (item["size"], item["digests"]["sha256"])

          local = {}
          for path in pathlib.Path("dist").iterdir():
              if not (path.name.endswith(".whl") or path.name.endswith(".tar.gz")):
                  continue
              local[path.name] = (path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          if len(local) != 2 or len(remote) != 2 or set(local) != set(remote):
              raise SystemExit(
                  "Existing PyPI release does not contain the exact local wheel + sdist: "
                  f"local={sorted(local)}, remote={sorted(remote)}"
              )
          for filename in sorted(local):
              if local[filename] != remote[filename]:
                  raise SystemExit(
                      f"Existing PyPI artifact differs from local verified build: {filename}; "
                      f"local={local[filename]}, remote={remote[filename]}"
                  )
              print(
                  f"RECOVERY MATCH {filename} size={local[filename][0]} "
                  f"sha256={local[filename][1]}"
              )

          with output.open("a", encoding="utf-8") as stream:
              stream.write("already_published=true\n")
          print("Exact release already exists on PyPI; safe recovery mode enabled.")
          PY

      - name: Create PyPI deployment record
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_SHA,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${process.env.RELEASE_TAG} at ${process.env.RELEASE_SHA}`);
            core.setOutput("id", deployment.data.id);

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.pypi_state.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create or verify release tag after successful PyPI state
        # The tag is created only after PyPI accepted the upload. An existing tag
        # is never rewritten: release tags are immutable. A tag that points at a
        # different commit is accepted when both commits carry the same tree,
        # which is the normal result of rebasing or squash-merging the release
        # branch after an earlier run created the tag. The 2.2.6 failure was
        # exactly this case: v2.2.6 pointed at the pre-rebase commit d73f6fa
        # while the workflow ran at its identical-tree squash commit a10cd8b,
        # and the step failed the release after PyPI had already accepted it.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag may have been created by an earlier attempt (or another
          # runner) after this checkout. Fetch tags first so the existence check
          # sees the current remote state instead of attempting a push that can
          # only be rejected.
          git fetch --force --tags origin

          assert_tag_matches_release_commit() {
            local tag_target
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" = "$RELEASE_SHA" ]; then
              return 0
            fi
            if git diff --quiet "$tag_target" "$RELEASE_SHA" --; then
              echo "::warning::Existing $RELEASE_TAG points to $tag_target, not $RELEASE_SHA, but both commits have identical trees (rebased/squashed release). Keeping the immutable tag."
              return 0
            fi
            echo "::error::Existing $RELEASE_TAG points to $tag_target, expected $RELEASE_SHA, and the trees differ. Refusing to rewrite a release tag."
            return 1
          }

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            assert_tag_matches_release_commit
            echo "Existing $RELEASE_TAG already marks an equivalent release commit; recovery is safe."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"

          if git push origin "$RELEASE_TAG"; then
            echo "Created and pushed $RELEASE_TAG at $RELEASE_SHA."
            exit 0
          fi

          # Losing a race to create the same tag is not a release failure if the
          # tag that won points at an equivalent commit. Re-fetch and verify.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          assert_tag_matches_release_commit
          echo "Another run created $RELEASE_TAG concurrently; verified it is equivalent."

      - name: Create metadata-only GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving metadata-only release."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Verify PyPI release and asset-free GitHub Release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"

      # The ONLY step in this workflow that may run after a failure. It reports the
# deployment outcome for the `pypi` environment; it cannot publish, create a
# tag, or alter any artifact, so it does not mask a failed publish. Everything
# that touches the registry or the tag runs only on success.
      - name: Set PyPI deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `Release pipeline ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);

  # Recovery for a version that already reached PyPI but whose post-publish tag
  # or GitHub Release step failed. This job never builds and never uploads: it
  # refuses versions that are not already on PyPI, so it cannot publish.
  recover_release_metadata:
    name: Recover tag and GitHub Release for a published version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: scientific-computing-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate inputs and resolve the release commit
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Recovery must be dispatched from refs/heads/main; got $GITHUB_REF."
            exit 1
          fi

          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION'; expected X.Y.Z."
            exit 1
          fi
          tag="v${version}"

          # The whole point of this path is that the release already exists.
          # A non-200 here means the normal release workflow must publish it.
          if ! curl --retry 3 --retry-delay 2 --fail --silent --show-error --location \
              "https://pypi.org/pypi/${PACKAGE}/${version}/json" > /dev/null; then
            echo "::error::${PACKAGE} ${version} is not published on PyPI; use the normal release path, not recovery."
            exit 1
          fi

          git fetch --force --tags origin

          if [ -n "$INPUT_SHA" ]; then
            if ! git cat-file -e "${INPUT_SHA}^{commit}" 2>/dev/null; then
              git fetch --force origin "$INPUT_SHA"
            fi
            target="$(git rev-parse --verify "${INPUT_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$target" origin/main; then
              echo "::error::$target is not on origin/main; refusing to tag an unreviewed commit."
              exit 1
            fi
          else
            target=""
            # The bump commit is the first first-parent commit on main whose
            # static version file declares the requested version. Later commits
            # keep that value until the next bump, so the first match is the one
            # that landed the release.
            while read -r commit; do
              [ -n "$commit" ] || continue
              declared="$(git show "${commit}:src/cds/_version.py" | sed -n 's/^__version__ = version = "\([^"]*\)"$/\1/p')"
              if [ "$declared" = "$version" ]; then
                target="$commit"
                break
              fi
            done < <(git log --first-parent --reverse --format=%H origin/main -- src/cds/_version.py)
            if [ -z "$target" ]; then
              echo "::error::Could not find the commit on main that introduced ${version}."
              exit 1
            fi
          fi

          declared="$(git show "${target}:src/cds/_version.py" | sed -n 's/^__version__ = version = "\([^"]*\)"$/\1/p')"
          if [ "$declared" != "$version" ]; then
            echo "::error::$target declares version '${declared}', not '${version}'."
            exit 1
          fi

          echo "Resolved $tag -> $target ($(git show -s --format=%s "$target"))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Create the missing tag, or verify the existing one
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          assert_tag_matches() {
            local tag_target
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" = "$TARGET_SHA" ]; then
              return 0
            fi
            if git diff --quiet "$tag_target" "$TARGET_SHA" --; then
              echo "::warning::$RELEASE_TAG points to $tag_target, not $TARGET_SHA, but both commits have identical trees. Keeping the immutable tag."
              return 0
            fi
            echo "::error::$RELEASE_TAG points to $tag_target and its tree differs from $TARGET_SHA. Refusing to rewrite a release tag."
            return 1
          }

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            assert_tag_matches
            echo "$RELEASE_TAG already exists; no tag created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"

          if git push origin "$RELEASE_TAG"; then
            echo "Created $RELEASE_TAG at $TARGET_SHA."
            exit 0
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          assert_tag_matches
          echo "Another run created $RELEASE_TAG concurrently; verified it is equivalent."

      - name: Create the metadata-only GitHub Release
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving it."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
            echo "Created metadata-only release $RELEASE_TAG."
          fi

      - name: Verify the recovered release is public and asset-free
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
