name: Release

# Single publish authority for GitHub + PyPI.
#
# Normal path: bump the package version in pyproject.toml and
# src/cds/_version.py, merge to main, and this workflow builds and verifies the
# wheel, creates the matching vX.Y.Z tag, publishes the exact artifacts to
# PyPI via Trusted Publishing (OIDC), and creates the matching GitHub Release.
#
# A manually pushed v* tag is also supported, but it must exactly match the
# package metadata. In both paths the installed CLI must pass before publishing.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "pyproject.toml"
      - "src/cds/_version.py"

permissions:
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify sdist/wheel + installed CLI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "branch" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Version $version is already tagged as $tag. Bump the package version before publishing again."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $tag"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package name and release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          print(f"Built package metadata: {package}")
          if package["Name"] != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package['Name']!r}")

          expected_version = os.environ["EXPECTED_VERSION"]
          if package["Version"] != expected_version:
              sys.exit(
                  f"Package version mismatch: expected={expected_version!r}, "
                  f"built={package['Version']!r}"
              )
          print(f"Package version verified: {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/verify_cli_install.py --expected-version "$EXPECTED_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI + GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release tag for a main-branch version bump
        if: github.ref_type == 'branch'
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create pypi deployment record
        id: deployment
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_TAG,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${process.env.RELEASE_TAG}`);
            core.setOutput("id", deployment.data.id);

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; uploading artifacts."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$RELEASE_TAG" dist/*
          fi

      - name: Set pypi deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `PyPI publish ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);
