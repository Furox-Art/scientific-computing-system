name: Release

# Single publish authority for PyPI + GitHub release artifacts.
#
# Normal path: bump the package version in BOTH pyproject.toml and
# src/cds/_version.py, merge to main, and this workflow builds and verifies the
# wheel/sdist, publishes those exact files to PyPI via Trusted Publishing
# (OIDC), then creates the matching vX.Y.Z tag and GitHub Release with the same
# wheel/sdist attached. The _version.py change is the only release trigger;
# ordinary pyproject.toml packaging edits do not publish a release. The tag
# created after a successful PyPI publish does not trigger a second publish run.
#
# The installed CLI must pass against the built wheel before anything is
# published. PyPI publication succeeds before the GitHub tag/release is created,
# preventing orphan GitHub releases when registry publishing fails.

on:
  push:
    branches:
      - main
    paths:
      - "src/cds/_version.py"

permissions:
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + verify + publish to PyPI + GitHub Release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Version $version is already tagged as $tag. Bump the package version before publishing again."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $tag"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package name and release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")
          if len(sdists) != 1:
              sys.exit(f"Expected exactly one sdist, found {len(sdists)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          expected_version = os.environ["EXPECTED_VERSION"]
          if package.get("Name") != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package.get('Name')!r}")
          if package.get("Version") != expected_version:
              sys.exit(
                  f"Package version mismatch: expected={expected_version!r}, "
                  f"built={package.get('Version')!r}"
              )

          expected_prefix = f"scientific_computing_system-{expected_version}/"
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          if not names or not all(name == expected_prefix.rstrip("/") or name.startswith(expected_prefix) for name in names):
              sys.exit("sdist root directory does not match the release version")

          print(f"Package metadata verified: scientific-computing-system {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/verify_cli_install.py --expected-version "$EXPECTED_VERSION"

      - name: Create PyPI deployment record
        id: deployment
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${process.env.RELEASE_TAG}`);
            core.setOutput("id", deployment.data.id);

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create release tag after successful PyPI publish
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release with published distribution assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; synchronizing distribution assets."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$RELEASE_TAG" dist/*
          fi

      - name: Set PyPI deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `PyPI publish ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);
