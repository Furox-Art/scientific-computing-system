name: Release

# Fully automated publish: pushing a `v*` tag builds the sdist + wheel,
# verifies package metadata and the installed CLI, uploads the artifacts to
# PyPI using a scoped API token (PYPI_API_TOKEN repo secret), and creates a
# GitHub Release with the same artifacts attached. The Attest Release Artifacts
# workflow then fires on `release: published` and signs them.
#
# Setup (one-time): create a PyPI API token scoped to
# `scientific-computing-system` (Account → API tokens), then add it as a
# repository secret named `PYPI_API_TOKEN`:
#   gh secret set PYPI_API_TOKEN < ~/.pypi-token
#
# This is the sole publish authority: `scripts/publish.py` no longer uploads to
# PyPI or creates the GitHub release — it only builds, tests, pushes the tag
# (which triggers this workflow), and deploys docs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify sdist/wheel + installed CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package name and tag/version agreement
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          print(f"Built package metadata: {package}")
          if package["Name"] != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package['Name']!r}")

          tag = os.environ["GITHUB_REF_NAME"]
          expected_version = tag.removeprefix("v")
          if package["Version"] != expected_version:
              sys.exit(
                  f"Tag/package version mismatch: tag={tag!r}, package={package['Version']!r}"
              )
          print(f"Tag and package version agree: {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        run: python scripts/verify_cli_install.py --expected-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI + GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create pypi deployment record
        id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${context.ref}`);
            core.setOutput("id", deployment.data.id);

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists; uploading artifacts."
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$tag" dist/*
          fi

      - name: Set pypi deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `PyPI publish ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);
