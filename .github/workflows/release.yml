name: Release

# Single publish authority for PyPI + GitHub release metadata.
#
# Normal path: bump the package version in BOTH pyproject.toml and
# src/cds/_version.py, merge to main, and let the full CI workflow complete.
# This workflow starts only from a successful CI *push* run on main, verifies
# that the exact CI-tested commit changed src/cds/_version.py, then builds and
# verifies the wheel/sdist, attests those exact runner-local files, publishes
# them to PyPI via Trusted Publishing (OIDC), and finally creates the matching
# vX.Y.Z tag plus a metadata-only GitHub Release.
#
# This CI hand-off is deliberate defense in depth: even if branch protection is
# accidentally disabled, a direct version bump cannot publish before the same
# commit has passed CI. Branch/ruleset protection is still required as the
# primary repository-control boundary because a writer could otherwise modify
# the CI/release workflows themselves.
#
# The workflow is intentionally idempotent after a partial release failure. If
# the exact version already exists on PyPI, its filenames, sizes, and SHA-256
# digests must match the locally verified build; only then is the upload skipped
# and the workflow allowed to recover the GitHub tag/release. An existing tag is
# accepted only when it resolves to the exact CI-tested release commit.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify successful main CI release candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.candidate.outputs.release_sha }}
      should_release: ${{ steps.candidate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Bind release to the exact CI-tested commit
        id: candidate
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$RELEASE_SHA" ]; then
            echo "::error::Checkout SHA $checked_out does not match CI head SHA $RELEASE_SHA."
            exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "${RELEASE_SHA}^1" >/dev/null; then
            if git diff --quiet "${RELEASE_SHA}^1" "$RELEASE_SHA" -- src/cds/_version.py; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "CI-tested commit did not change src/cds/_version.py; no release required."
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "CI-tested commit changed src/cds/_version.py; release authorized."
            fi
          elif git ls-tree -r --name-only "$RELEASE_SHA" | grep -Fxq "src/cds/_version.py"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Root commit contains src/cds/_version.py; release authorized."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Root commit has no src/cds/_version.py; no release required."
          fi

  publish:
    name: Build + verify + publish to PyPI + metadata-only GitHub Release
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      deployments: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Re-verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$RELEASE_SHA" ]; then
            echo "::error::Publish checkout $checked_out does not match authorized SHA $RELEASE_SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $tag from $RELEASE_SHA"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package name and release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")
          if len(sdists) != 1:
              sys.exit(f"Expected exactly one sdist, found {len(sdists)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          expected_version = os.environ["EXPECTED_VERSION"]
          if package.get("Name") != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package.get('Name')!r}")
          if package.get("Version") != expected_version:
              sys.exit(
                  f"Package version mismatch: expected={expected_version!r}, "
                  f"built={package.get('Version')!r}"
              )

          expected_prefix = f"scientific_computing_system-{expected_version}/"
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          if not names or not all(
              name == expected_prefix.rstrip("/") or name.startswith(expected_prefix)
              for name in names
          ):
              sys.exit("sdist root directory does not match the release version")

          print(f"Package metadata verified: scientific-computing-system {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/verify_cli_install.py --expected-version "$EXPECTED_VERSION"

      - name: Attest verified runner-local build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Inspect existing public PyPI release for safe recovery
        id: pypi_state
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          project = "scientific-computing-system"
          version = os.environ["EXPECTED_VERSION"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          api_url = f"https://pypi.org/pypi/{project}/{version}/json"

          try:
              with urllib.request.urlopen(api_url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("already_published=false\n")
              print(f"PyPI {project} {version} does not exist yet; upload required.")
              raise SystemExit(0)

          remote = {}
          for item in payload.get("urls", []):
              if item.get("packagetype") not in {"bdist_wheel", "sdist"}:
                  continue
              filename = item["filename"]
              if filename in remote:
                  raise SystemExit(f"Duplicate PyPI artifact filename: {filename}")
              remote[filename] = (item["size"], item["digests"]["sha256"])

          local = {}
          for path in pathlib.Path("dist").iterdir():
              if not (path.name.endswith(".whl") or path.name.endswith(".tar.gz")):
                  continue
              local[path.name] = (path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          if len(local) != 2 or len(remote) != 2 or set(local) != set(remote):
              raise SystemExit(
                  "Existing PyPI release does not contain the exact local wheel + sdist: "
                  f"local={sorted(local)}, remote={sorted(remote)}"
              )
          for filename in sorted(local):
              if local[filename] != remote[filename]:
                  raise SystemExit(
                      f"Existing PyPI artifact differs from local verified build: {filename}; "
                      f"local={local[filename]}, remote={remote[filename]}"
                  )
              print(
                  f"RECOVERY MATCH {filename} size={local[filename][0]} "
                  f"sha256={local[filename][1]}"
              )

          with output.open("a", encoding="utf-8") as stream:
              stream.write("already_published=true\n")
          print("Exact release already exists on PyPI; safe recovery mode enabled.")
          PY

      - name: Create PyPI deployment record
        id: deployment
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_SHA,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${process.env.RELEASE_TAG} at ${process.env.RELEASE_SHA}`);
            core.setOutput("id", deployment.data.id);

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.pypi_state.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create or verify release tag after successful PyPI state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" != "$RELEASE_SHA" ]; then
              echo "::error::Existing $RELEASE_TAG points to $tag_target, expected $RELEASE_SHA. Refusing to rewrite a release tag."
              exit 1
            fi
            echo "Existing $RELEASE_TAG already resolves to the authorized release commit; recovery is safe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create metadata-only GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving metadata-only release."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Verify PyPI release and asset-free GitHub Release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"

      - name: Set PyPI deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `Release pipeline ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);
