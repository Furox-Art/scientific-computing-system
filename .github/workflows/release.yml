name: Release

# Single publish authority for PyPI + GitHub release artifacts.
#
# Normal path: bump the package version in BOTH pyproject.toml and
# src/cds/_version.py, merge to main, and this workflow builds and verifies the
# wheel/sdist, publishes those exact files to PyPI via Trusted Publishing
# (OIDC), then creates the matching vX.Y.Z tag and GitHub Release with the same
# wheel/sdist attached. The _version.py change is the only release trigger;
# ordinary pyproject.toml packaging edits do not publish a release. The tag
# created after a successful PyPI publish does not trigger a second publish run.
#
# The workflow is intentionally idempotent after a partial release failure. If
# the exact version already exists on PyPI, its filenames, sizes, and SHA-256
# digests must match the locally verified build; only then is the upload skipped
# and the workflow allowed to recover the GitHub tag/release. An existing tag is
# accepted only when it resolves to the current release commit. The final
# integrity gate compares public PyPI with the GitHub Release before success.

on:
  push:
    branches:
      - main
    paths:
      - "src/cds/_version.py"

permissions:
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + verify + publish to PyPI + GitHub Release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $tag"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package name and release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")
          if len(sdists) != 1:
              sys.exit(f"Expected exactly one sdist, found {len(sdists)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode()

          package = dict(
              line.split(": ", 1)
              for line in metadata.splitlines()
              if ": " in line and line.split(": ", 1)[0] in {"Name", "Version"}
          )
          expected_version = os.environ["EXPECTED_VERSION"]
          if package.get("Name") != "scientific-computing-system":
              sys.exit(f"Unexpected package name: {package.get('Name')!r}")
          if package.get("Version") != expected_version:
              sys.exit(
                  f"Package version mismatch: expected={expected_version!r}, "
                  f"built={package.get('Version')!r}"
              )

          expected_prefix = f"scientific_computing_system-{expected_version}/"
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
          if not names or not all(
              name == expected_prefix.rstrip("/") or name.startswith(expected_prefix)
              for name in names
          ):
              sys.exit("sdist root directory does not match the release version")

          print(f"Package metadata verified: scientific-computing-system {expected_version}")
          PY

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"

      - name: Smoke-test installed CLI before publish
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/verify_cli_install.py --expected-version "$EXPECTED_VERSION"

      - name: Inspect existing public PyPI release for safe recovery
        id: pypi_state
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          project = "scientific-computing-system"
          version = os.environ["EXPECTED_VERSION"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          api_url = f"https://pypi.org/pypi/{project}/{version}/json"

          try:
              with urllib.request.urlopen(api_url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("already_published=false\n")
              print(f"PyPI {project} {version} does not exist yet; upload required.")
              raise SystemExit(0)

          remote = {}
          for item in payload.get("urls", []):
              if item.get("packagetype") not in {"bdist_wheel", "sdist"}:
                  continue
              filename = item["filename"]
              if filename in remote:
                  raise SystemExit(f"Duplicate PyPI artifact filename: {filename}")
              remote[filename] = (item["size"], item["digests"]["sha256"])

          local = {}
          for path in pathlib.Path("dist").iterdir():
              if not (path.name.endswith(".whl") or path.name.endswith(".tar.gz")):
                  continue
              local[path.name] = (path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          if len(local) != 2 or len(remote) != 2 or set(local) != set(remote):
              raise SystemExit(
                  "Existing PyPI release does not contain the exact local wheel + sdist: "
                  f"local={sorted(local)}, remote={sorted(remote)}"
              )
          for filename in sorted(local):
              if local[filename] != remote[filename]:
                  raise SystemExit(
                      f"Existing PyPI artifact differs from local verified build: {filename}; "
                      f"local={local[filename]}, remote={remote[filename]}"
                  )
              print(
                  f"RECOVERY MATCH {filename} size={local[filename][0]} "
                  f"sha256={local[filename][1]}"
              )

          with output.open("a", encoding="utf-8") as stream:
              stream.write("already_published=true\n")
          print("Exact release already exists on PyPI; safe recovery mode enabled.")
          PY

      - name: Create PyPI deployment record
        id: deployment
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "pypi",
              transient_environment: false,
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });
            core.info(`Created deployment #${deployment.data.id} for ${process.env.RELEASE_TAG}`);
            core.setOutput("id", deployment.data.id);

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.pypi_state.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create or verify release tag after successful PyPI state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "::error::Existing $RELEASE_TAG points to $tag_target, expected $GITHUB_SHA. Refusing to rewrite a release tag."
              exit 1
            fi
            echo "Existing $RELEASE_TAG already resolves to the current release commit; recovery is safe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create GitHub Release with published distribution assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; synchronizing distribution assets."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$RELEASE_TAG" dist/*
          fi

      - name: Verify PyPI and GitHub Release artifact parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"

      - name: Set PyPI deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state,
              environment_url: "https://pypi.org/project/scientific-computing-system/",
              description: `Release pipeline ${state}`
            });
            core.info(`Deployment #${{ steps.deployment.outputs.id }} marked ${state}`);
