name: Dependabot Auto Merge

# Fail-closed Dependabot automation. Branch protection is not assumed: this
# workflow explicitly waits for the three repository quality workflows on the
# exact PR head SHA before allowing a patch/minor dependency update to merge.
# A failed, cancelled, missing, or timed-out quality workflow blocks the merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for required quality workflows
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required=("CI" "CodeQL" "Installed CLI Smoke")

          for workflow in "${required[@]}"; do
            echo "Waiting for $workflow on $HEAD_SHA"
            resolved="false"
            for attempt in $(seq 1 80); do
              result="$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
                --jq ".workflow_runs[] | select(.name == \"$workflow\") | [.status, (.conclusion // \"\")] | @tsv" \
                | head -n 1)"

              if [[ -z "$result" ]]; then
                sleep 15
                continue
              fi

              status="${result%%$'\t'*}"
              conclusion="${result#*$'\t'}"
              if [[ "$status" != "completed" ]]; then
                sleep 15
                continue
              fi
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::$workflow completed with conclusion=$conclusion"
                exit 1
              fi

              resolved="true"
              echo "::notice::$workflow passed for $HEAD_SHA"
              break
            done

            if [[ "$resolved" != "true" ]]; then
              echo "::error::Timed out waiting for $workflow on $HEAD_SHA"
              exit 1
            fi
          done

      - name: Merge verified patch/minor update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

      - name: Report major update policy
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update is never auto-merged; manual review is required."
