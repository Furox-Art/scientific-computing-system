name: Dependabot Auto Merge

# Enables GitHub's native auto-merge for Dependabot PRs so that, once CI
# passes, the PR merges itself with no human in the loop.
#
# HISTORY / WHY THIS IS NON-TRIVIAL:
#   This workflow used to be an illusion. `gh pr merge --auto --squash` ran
#   fine, but with `required_approving_review_count: 1` + `enforce_admins:
#   true` on `main`, the auto-merge could *never complete* — no account
#   existed that could satisfy the approval (the single maintainer is the
#   author of every PR, and GitHub forbids self-approval; dependabot[bot]
#   cannot approve its own PR; the default GITHUB_TOKEN cannot approve).
#   Every Dependabot PR therefore stalled in the queue forever. PR #61 hit
#   the exact same wall for a maintainer-authored PR.
#
#   As of this commit, branch protection requires 0 approvals (single-
#   maintainer reality; CodeQL + CI status checks still gate the merge), so
#   auto-merge now actually reaches MERGED. The companion workflow
#   `bot-reviewer.yml` keeps the *option* of returning to `require approvals:
#   1` by auto-approving Dependabot PRs once a `REVIEW_BOT_TOKEN` secret is
#   in place — see its header.
#
# `allow_auto_merge` must be enabled at the repo level (Settings → General →
# Pull Requests → "Allow auto-merge"). It is currently enabled.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash) for Dependabot PRs
        # Only patch and minor updates. `--auto` arms the merge and GitHub
        # completes it once every *required* status check is green — but `main`
        # currently has no branch protection, so there are no required checks
        # and an armed merge lands immediately. Gating on update-type is
        # therefore the only thing standing between a major action bump and an
        # unreviewed merge, and major bumps are exactly the ones that carry
        # config-schema changes (actions/labeler v5 changed its schema).
        #
        # To have CI gate this instead, protect `main` and mark the aggregate
        # `CI` job as a required context — it exists for precisely that purpose,
        # see the comment above it in tests.yml. Then this condition can widen.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # NOTE: --auto and --admin are mutually exclusive; gh rejects the pair
        # with "specify only one of --auto, --disable-auto, or --admin". This
        # step passed both and so had never once succeeded — invisible until the
        # dependabot config itself was repaired and the first PR appeared.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report auto-merge status
        if: always()
        run: |
          echo "Dependabot update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Dependency: ${{ steps.metadata.outputs.dependency-names }} (${{ steps.metadata.outputs.new-version }})"
          if [ "${{ steps.metadata.outputs.update-type }}" = "version-update:semver-major" ]; then
            echo "::notice::Major update — auto-merge deliberately NOT armed, review by hand."
          else
            echo "::notice::Auto-merge armed for ${{ github.event.pull_request.html_url }}"
          fi
