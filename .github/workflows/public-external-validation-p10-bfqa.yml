name: Public external validation P10 BayesFactor QA

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p10-bfqa.yml'
      - 'tools/public_external_validation_p10_bfqa_prepare.py'
      - 'tools/public_external_validation_p10_bfqa.R'
      - 'tools/public_p10_source_bf_manifest.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install requests numpy scipy
      - name: Prepare fixed-grid QA inputs from exact source derivatives
        run: python tools/public_external_validation_p10_bfqa_prepare.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Install code-referenced BayesFactor and JSON package
        shell: Rscript {0}
        run: |
          install.packages(c('remotes','jsonlite'), repos='https://cloud.r-project.org')
          remotes::install_version('BayesFactor', version='0.9.12-4.2', repos='https://cloud.r-project.org', upgrade='never', dependencies=TRUE)
      - name: Recompute fixed-grid Bayes factors
        id: bfqa
        shell: bash
        run: |
          set +e
          Rscript tools/public_external_validation_p10_bfqa.R .public-runner/p10/bfqa
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show QA result
        if: always()
        run: cat .public-runner/p10/bfqa/bayesfactor_qa_result.json || true
      - name: Upload compact QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p10-bayesfactor-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            .public-runner/p10/bfqa/qa_input_manifest.json
            .public-runner/p10/bfqa/*_qa_recomputed.csv
            .public-runner/p10/bfqa/bayesfactor_qa_result.json
      - name: Fail if QA computation failed
        if: always()
        run: test "${{ steps.bfqa.outputs.exit_code }}" = "0"
