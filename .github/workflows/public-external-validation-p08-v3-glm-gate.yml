name: Public external validation P08 V3 GLM completion gate

on:
  workflow_run:
    workflows:
      - Public external validation P08 AFNI ANTs tedana sensitivity V2 resource-safe
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  gate-and-dispatch:
    if: >-
      github.event.workflow_run.id == 35404439901 &&
      github.event.workflow_run.head_sha == 'c6980f840c13e8e2423f3752953041e8040e8b39' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact preprocessing jobs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/35404439901/jobs?filter=latest&per_page=100" > /tmp/jobs.json
          gh api "repos/$GH_REPO/actions/runs/35404439901/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          expected={
            'preprocess (sub-Bubbles)',
            'preprocess (sub-Buttercup)',
            'preprocess (sub-PILOT02)',
          }
          got={j['name']:j.get('conclusion') for j in jobs if j['name'] in expected}
          if set(got)!=expected:
              raise SystemExit(f'job set mismatch: {got}')
          bad={k:v for k,v in got.items() if v!='success'}
          if bad:
              raise SystemExit(f'preprocessing jobs not all successful: {bad}')

          arts=json.load(open('/tmp/artifacts.json'))['artifacts']
          names={a['name'] for a in arts if not a.get('expired')}
          expected_artifacts=set()
          for p in ('sub-Bubbles','sub-Buttercup','sub-PILOT02'):
              expected_artifacts.add(f'public-p08-opensource-v2-preprocessed-{p}')
              expected_artifacts.add(f'public-p08-opensource-v2-preprocessing-provenance-{p}')
          missing=sorted(expected_artifacts-names)
          if missing:
              raise SystemExit(f'missing required preprocessing artifacts: {missing}')
          print(json.dumps({'jobs':got,'required_artifacts':sorted(expected_artifacts)},indent=2))
          PY

      - name: Dispatch frozen V3 target Self-Other GLM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GH_REPO/actions/workflows/public-external-validation-p08-v2-glm.yml/dispatches"             -f ref='external-validation-public-runner-20260918'
          echo 'V3 target GLM dispatch accepted after exact 3/3 preprocessing gate.'
