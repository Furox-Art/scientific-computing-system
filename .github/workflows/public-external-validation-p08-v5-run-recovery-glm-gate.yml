name: Public external validation P08 V5 run-recovery GLM gate

on:
  workflow_run:
    workflows:
      - Public external validation P08 V2 run-recovery participant merge
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  gate-and-dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify successful run-recovery merge artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
          MERGE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$MERGE_RUN_ID" > /tmp/run.json
          gh api "repos/$GH_REPO/actions/runs/$MERGE_RUN_ID/artifacts?per_page=100" > /tmp/artifacts.json
          gh api "repos/$GH_REPO/actions/runs/35404439901/artifacts?per_page=100" > /tmp/pilot.json
          python - <<'PY'
          import json
          run=json.load(open('/tmp/run.json'))
          if run.get('name')!='Public external validation P08 V2 run-recovery participant merge':
              raise SystemExit(f"wrong workflow {run.get('name')}")
          if run.get('conclusion')!='success' or run.get('event')!='workflow_dispatch':
              raise SystemExit(f"ineligible merge run {run.get('conclusion')} {run.get('event')}")
          names={a['name'] for a in json.load(open('/tmp/artifacts.json'))['artifacts'] if not a.get('expired')}
          expected={
            'public-p08-v2-run-recovery-merged-preprocessed-sub-Bubbles',
            'public-p08-v2-run-recovery-merged-provenance-sub-Bubbles',
            'public-p08-v2-run-recovery-merged-preprocessed-sub-Buttercup',
            'public-p08-v2-run-recovery-merged-provenance-sub-Buttercup',
          }
          missing=sorted(expected-names)
          if missing: raise SystemExit(f"missing merge artifacts {missing}")
          pilot={a['name'] for a in json.load(open('/tmp/pilot.json'))['artifacts'] if not a.get('expired')}
          reqp={
            'public-p08-opensource-v2-preprocessed-sub-PILOT02',
            'public-p08-opensource-v2-preprocessing-provenance-sub-PILOT02',
          }
          missp=sorted(reqp-pilot)
          if missp: raise SystemExit(f"missing PILOT02 artifacts {missp}")
          print(json.dumps({'merge_run_id':run['id'],'artifacts':sorted(expected)},indent=2))
          PY

      - name: Dispatch frozen V5 target GLM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
          MERGE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GH_REPO/actions/workflows/public-external-validation-p08-v5-run-recovery-glm.yml/dispatches"             -f ref='external-validation-public-runner-20260918'             -f "inputs[merge_run_id]=$MERGE_RUN_ID"
          echo "V5 target GLM dispatch accepted for merge run $MERGE_RUN_ID."
