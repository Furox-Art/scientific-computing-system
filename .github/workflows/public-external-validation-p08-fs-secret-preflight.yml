name: Public external validation P08 FreeSurfer secret preflight

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p08-fs-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FS_LICENSE_TEXT: ${{ secrets.FS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918

      - name: Record FreeSurfer license prerequisite presence without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .public-runner/p08/freesurfer-secret-preflight
          python3 - <<'PY'
          import json, os
          present = bool(os.environ.get("FS_LICENSE_TEXT", ""))
          out = {
              "status": "P08_FREESURFER_LICENSE_SECRET_PRESENT" if present else "P08_FREESURFER_LICENSE_SECRET_MISSING",
              "secret_name": "FS_LICENSE",
              "secret_present": present,
              "secret_value_logged": False,
              "data_download_started": False,
              "preprocessing_started": False,
              "neural_effect_computed": False,
              "scientific_note": "The frozen primary preprocessing route requires FreeSurfer bbregister. Missing license is an execution prerequisite blocker, not a neural result."
          }
          path = ".public-runner/p08/freesurfer-secret-preflight/preflight.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: public-p08-freesurfer-secret-preflight
          retention-days: 14
          if-no-files-found: error
          path: .public-runner/p08/freesurfer-secret-preflight/preflight.json
