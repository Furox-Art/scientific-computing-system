name: PyPI Registry CLI Smoke

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/pypi-registry-smoke.yml"
      - "scripts/verify_pypi_release.py"
      - "scripts/verify_release_integrity.py"

permissions:
  contents: read

concurrency:
  group: pypi-registry-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  registry-cli:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: public PyPI CLI on ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact release from public PyPI
        run: python scripts/verify_pypi_release.py

  release-policy:
    name: verify metadata-only GitHub Release policy
    needs: registry-cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify PyPI publication and metadata-only GitHub Release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
