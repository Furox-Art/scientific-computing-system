name: PyPI Registry CLI Smoke

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: pypi-registry-smoke-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  registry-cli:
    if: github.event.workflow_run.conclusion == 'success'
    name: public PyPI CLI on ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact release from public PyPI
        run: python scripts/verify_pypi_release.py

  release-policy:
    if: github.event.workflow_run.conclusion == 'success'
    name: verify metadata-only GitHub Release policy
    needs: registry-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify PyPI publication and GitHub asset-free release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/verify_release_integrity.py
          --repository "$GITHUB_REPOSITORY"
