name: PyPI Registry CLI Smoke

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/pypi-registry-smoke.yml"
      - "scripts/verify_pypi_release.py"
      - "scripts/verify_release_integrity.py"

permissions:
  contents: read

concurrency:
  group: pypi-registry-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  registry-cli:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: public PyPI CLI on ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact release from public PyPI
        run: python scripts/verify_pypi_release.py

  github-release-policy:
    name: enforce metadata-only GitHub Release policy
    needs: registry-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Remove forbidden wheel and sdist assets from matching GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id'
          )"
          asset_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq '.[] | select((.name | endswith(".whl")) or (.name | endswith(".tar.gz"))) | .id'
          )"
          if [ -z "$asset_ids" ]; then
            echo "No forbidden distribution assets found on $RELEASE_TAG."
          else
            for asset_id in $asset_ids; do
              echo "Deleting forbidden GitHub Release distribution asset id=$asset_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
          fi

      - name: Verify public PyPI and asset-free GitHub Release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python scripts/verify_release_integrity.py
          --version "$RELEASE_VERSION"
          --repository "$GITHUB_REPOSITORY"
