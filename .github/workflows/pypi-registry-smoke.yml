name: PyPI Registry CLI Smoke

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pypi-registry-smoke.yml"
      - "scripts/verify_pypi_release.py"

permissions:
  contents: read

concurrency:
  group: pypi-registry-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  registry-cli:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: public PyPI CLI on ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify exact release from public PyPI
        run: python scripts/verify_pypi_release.py

  sync-release-assets:
    name: synchronize GitHub Release assets with public PyPI
    needs: registry-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download exact wheel and sdist from public PyPI and verify SHA-256
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          project = "scientific-computing-system"
          version = os.environ["RELEASE_VERSION"]
          api_url = f"https://pypi.org/pypi/{project}/{version}/json"
          with urllib.request.urlopen(api_url) as response:
              payload = json.load(response)

          wanted = {"bdist_wheel", "sdist"}
          files = [item for item in payload["urls"] if item.get("packagetype") in wanted]
          if len(files) != 2:
              raise SystemExit(f"Expected exactly wheel + sdist on PyPI, found {len(files)} files")
          if {item["packagetype"] for item in files} != wanted:
              raise SystemExit("PyPI release does not contain exactly one wheel and one sdist")

          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          for item in files:
              filename = item["filename"]
              target = dist / filename
              with urllib.request.urlopen(item["url"]) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              expected = item["digests"]["sha256"]
              if digest != expected:
                  raise SystemExit(
                      f"SHA-256 mismatch for {filename}: downloaded={digest}, PyPI={expected}"
                  )
              target.write_bytes(data)
              print(f"VERIFIED {filename} sha256={digest}")
          PY

      - name: Synchronize exact PyPI files to matching GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets
