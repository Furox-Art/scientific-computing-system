name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/cds/**"
      - "tests/fuzz/**"
      - "pyproject.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-scientific-computing-system
  cancel-in-progress: true

jobs:
  fuzz:
    name: Atheris
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Atheris
        run: python -m pip install atheris==3.1.0
      - name: Install scientific-computing-system
        run: python -m pip install -e .
      - name: Fuzz the BPE merge validator
        run: python tests/fuzz/fuzz_bpe_merge.py -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
