name: Public external validation P10 source BF

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p10-source-bf.yml'
      - 'tools/public_external_validation_p10_source_bf.py'
      - 'tools/public_p10_source_bf_manifest.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy scipy

      - name: Recover exact source BF derivatives
        id: recover
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p10_source_bf.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show result
        if: always()
        run: cat .public-runner/p10/source_bf/source_bf_result.json

      - name: Upload source BF derivatives and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p10-source-bf-exact
          if-no-files-found: warn
          retention-days: 14
          path: |
            .public-runner/p10/source_bf/*.mat
            .public-runner/p10/source_bf/source_bf_result.json

      - name: Commit compact result only
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .public-runner/p10/source_bf/source_bf_result.json
          if git diff --cached --quiet; then
            echo 'No source BF result change.'
          else
            git commit -m 'Record exact P10 source BF derivative recovery'
            git push origin HEAD:external-validation-public-runner-20260918
          fi

      - name: Fail if recovery failed
        if: always()
        run: test "${{ steps.recover.outputs.exit_code }}" = "0"
