name: Public external validation P08 V2 session-sharded recovery

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p08-v2-session-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - participant: sub-Bubbles
            session: ses-01
          - participant: sub-Bubbles
            session: ses-04
          - participant: sub-Buttercup
            session: ses-04
          - participant: sub-Buttercup
            session: ses-05

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests \
            'tedana==26.0.3' \
            'templateflow==25.1.2'
          python - <<'PY'
          import tedana, templateflow
          assert tedana.__version__ == "26.0.3", tedana.__version__
          print("tedana", tedana.__version__)
          print("templateflow", templateflow.__version__)
          PY

      - name: Install pinned ANTs 2.6.5 binary
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ANTsX/ANTs/releases/download/v2.6.5/ants-2.6.5-ubuntu-24.04-X64-gcc.zip'
          expected='9f6a2c8881d6c94ea17171c0502e55cb898ad9afd50e4e23fde9a8c0997aa04b'
          curl -L --retry 4 --retry-delay 3 -o /tmp/ants.zip "$url"
          echo "$expected  /tmp/ants.zip" | sha256sum -c -
          unzip -q /tmp/ants.zip -d /tmp/ants
          rm -f /tmp/ants.zip
          bindir="$(find /tmp/ants -type f -name antsRegistration -printf '%h\n' | head -n1)"
          test -n "$bindir"
          libdir="$(dirname "$bindir")/lib"
          test -d "$libdir"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$libdir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$bindir/antsRegistration" --version | head -n 3

      - name: Pull exact AFNI image
        shell: bash
        run: |
          set -euo pipefail
          image='afni/afni_make_build@sha256:c8365868751116f1ef2d0811e8a4dd2df58a689da457c74ea07fedb0e11dc0d6'
          docker pull "$image"
          docker run --rm "$image" afni -ver | head -n 6

      - name: Record runner resources
        shell: bash
        run: |
          set -euo pipefail
          df -h
          free -h
          nproc

      - name: Reconstruct exact frozen session BIDS subset
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_external_validation_p08_sensitivity_prepare.py \
            --participant "${{ matrix.participant }}" \
            --session "${{ matrix.session }}" \
            --root .public-runner/p08/opensource-v2

      - name: Run exact V2 preprocessing for one frozen session
        id: preprocess
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p08_opensource_preprocess.py \
            --participant "${{ matrix.participant }}" \
            --session "${{ matrix.session }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify shard eligibility and no neural outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          p="${{ matrix.participant }}"
          s="${{ matrix.session }}"
          result=".public-runner/p08/opensource-v2/$p/opensource_preprocessing_result.json"
          recon=".public-runner/p08/opensource-v2/$p/input_reconstruction.json"
          test -s "$result"
          test -s "$recon"
          python - "$result" "$recon" "$p" "$s" <<'PY'
          import json, sys
          result_path,recon_path,p,s=sys.argv[1:]
          r=json.load(open(result_path))
          q=json.load(open(recon_path))
          assert r["status"]=="P08_OPEN_SOURCE_SECONDARY_PREPROCESSING_V2_SESSION_SHARD_COMPLETE",r.get("status")
          assert r["participant"]==p
          assert r.get("session_filter")==s
          assert r["expected_run_count"]==2,r.get("expected_run_count")
          assert r["mni_optcom_run_count"]==2,r.get("mni_optcom_run_count")
          assert r["sessions_expected"]=={s:[1,2]},r.get("sessions_expected")
          assert not r.get("self_other_glm_computed",False)
          assert not r.get("roi_effect_computed",False)
          assert not r.get("neural_effect_computed",False)
          assert q["participant"]==p
          assert q.get("session_filter")==s
          assert q.get("all_exact_verified") is True
          print(json.dumps({
            "status":r["status"],
            "participant":p,
            "session":s,
            "expected_run_count":r["expected_run_count"],
            "mni_optcom_run_count":r["mni_optcom_run_count"],
            "exact_input_verified":q["all_exact_verified"],
            "neural_effect_computed":False,
          },indent=2))
          PY

      - name: Upload compact shard provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-v2-recovery-provenance-${{ matrix.participant }}-${{ matrix.session }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/input_reconstruction.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing.log
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_0GenericAffine.mat
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_1Warp.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_Warped.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/${{ matrix.session }}/results/*.1D
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/${{ matrix.session }}/results/QC_*/

      - name: Upload GLM-relevant shard derivatives
        if: steps.preprocess.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-v2-recovery-preprocessed-${{ matrix.participant }}-${{ matrix.session }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/mni/*_${{ matrix.session }}_*space-MNI152NLin2009cAsym_res-02_desc-optcom_bold.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/tedana/${{ matrix.session }}/run-*/t2smap/*T2star*
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/bids/${{ matrix.participant }}/${{ matrix.session }}/func/*task-SORPF*_events.tsv
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/${{ matrix.session }}/results/*.1D
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json

      - name: Fail if preprocessing failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.preprocess.outputs.exit_code }}" = "0"
