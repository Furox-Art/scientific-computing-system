name: tmp Moral Imagination manifest
on:
  push:
    paths:
      - '.github/workflows/tmp-moral-imagination-manifest.yml'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: List OSF ehc6v tree
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 reproducibility-data-acquisition/1.0'})
          rows=[]
          def walk(url,prefix=''):
              while url:
                  r=s.get(url,timeout=60); r.raise_for_status(); j=r.json()
                  for item in j.get('data',[]):
                      a=item.get('attributes',{}); rel=item.get('relationships',{})
                      name=a.get('name') or item.get('id'); kind=a.get('kind'); p=(prefix+'/'+name).strip('/')
                      rows.append({'id':item.get('id'),'name':name,'kind':kind,'path':p,'download':(item.get('links') or {}).get('download'),'size':a.get('size')})
                      if kind=='folder':
                          u=(rel.get('files') or {}).get('links',{}).get('related',{}).get('href')
                          if u: walk(u,p)
                  url=(j.get('links') or {}).get('next')
          walk('https://api.osf.io/v2/nodes/ehc6v/files/osfstorage/')
          pathlib.Path('out').mkdir(exist_ok=True)
          pathlib.Path('out/manifest.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'n':len(rows),'paths':[r['path'] for r in rows]},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: moral-imagination-ehc6v-manifest
          path: out/
          retention-days: 1
