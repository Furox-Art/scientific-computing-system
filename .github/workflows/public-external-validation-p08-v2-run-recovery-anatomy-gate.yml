name: Public external validation P08 V2 run-recovery anatomy gate

on:
  workflow_run:
    workflows:
      - Public external validation P08 V2 run-recovery anatomy
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  gate-and-dispatch:
    if: >-
      github.event.workflow_run.id == 35413863179 &&
      github.event.workflow_run.head_sha == 'ede3bddb74f96c57125865692292c47df3b1d031' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact anatomy jobs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/35413863179/jobs?filter=latest&per_page=100" > /tmp/jobs.json
          gh api "repos/$GH_REPO/actions/runs/35413863179/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          expected={'anatomy (sub-Bubbles)','anatomy (sub-Buttercup)'}
          got={j['name']:j.get('conclusion') for j in jobs if j['name'] in expected}
          if set(got)!=expected or any(v!='success' for v in got.values()):
              raise SystemExit(f'anatomy jobs not eligible: {got}')
          names={a['name'] for a in json.load(open('/tmp/artifacts.json'))['artifacts'] if not a.get('expired')}
          required={
            'public-p08-v2-run-recovery-anatomy-sub-Bubbles',
            'public-p08-v2-run-recovery-anatomy-sub-Buttercup',
          }
          missing=sorted(required-names)
          if missing: raise SystemExit(f'missing anatomy artifacts: {missing}')
          print(json.dumps({'jobs':got,'artifacts':sorted(required)},indent=2))
          PY

      - name: Dispatch run-sharded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GH_REPO/actions/workflows/public-external-validation-p08-v2-run-recovery.yml/dispatches"             -f ref='external-validation-public-runner-20260918'             -f "inputs[anatomy_run_id]=35413863179"
          echo 'Run-sharded recovery dispatch accepted.'
