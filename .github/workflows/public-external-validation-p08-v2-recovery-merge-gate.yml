name: Public external validation P08 V2 recovery merge gate

on:
  workflow_run:
    workflows:
      - Public external validation P08 V2 session-sharded recovery
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  gate-and-dispatch:
    if: >-
      github.event.workflow_run.id == 35412820309 &&
      github.event.workflow_run.head_sha == '6387fb5721b803fb8ba11e22aca32084d211c7aa' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact recovery jobs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/35412820309/jobs?filter=latest&per_page=100" > /tmp/jobs.json
          gh api "repos/$GH_REPO/actions/runs/35412820309/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json
          expected_jobs={
            'recovery-shard (sub-Bubbles, ses-01)',
            'recovery-shard (sub-Bubbles, ses-04)',
            'recovery-shard (sub-Buttercup, ses-04)',
            'recovery-shard (sub-Buttercup, ses-05)',
          }
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          got={j['name']:j.get('conclusion') for j in jobs if j['name'] in expected_jobs}
          if set(got)!=expected_jobs:
              raise SystemExit(f'job set mismatch: {got}')
          bad={k:v for k,v in got.items() if v!='success'}
          if bad:
              raise SystemExit(f'recovery jobs not all successful: {bad}')

          names={a['name'] for a in json.load(open('/tmp/artifacts.json'))['artifacts'] if not a.get('expired')}
          expected_artifacts=set()
          for p,s in (
            ('sub-Bubbles','ses-01'),
            ('sub-Bubbles','ses-04'),
            ('sub-Buttercup','ses-04'),
            ('sub-Buttercup','ses-05'),
          ):
              expected_artifacts.add(f'public-p08-v2-recovery-preprocessed-{p}-{s}')
              expected_artifacts.add(f'public-p08-v2-recovery-provenance-{p}-{s}')
          missing=sorted(expected_artifacts-names)
          if missing:
              raise SystemExit(f'missing recovery artifacts: {missing}')
          print(json.dumps({'jobs':got,'artifacts':sorted(expected_artifacts)},indent=2))
          PY

      - name: Dispatch participant merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GH_REPO/actions/workflows/public-external-validation-p08-v2-recovery-merge.yml/dispatches"             -f ref='external-validation-public-runner-20260918'
          echo 'Recovery participant merge dispatch accepted.'
