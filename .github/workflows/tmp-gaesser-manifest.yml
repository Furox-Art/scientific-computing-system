name: tmp Gaesser Round 20 manifest
on:
  push:
    paths:
      - '.github/workflows/tmp-gaesser-manifest.yml'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: List OSF 66gf4 tree only
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 reproducibility-data-acquisition/1.0'})
          rows=[]
          def walk(url,prefix=''):
              while url:
                  j=s.get(url,timeout=60).json()
                  for item in j.get('data',[]):
                      a=item.get('attributes',{}); rel=item.get('relationships',{})
                      name=a.get('name') or item.get('id'); kind=a.get('kind'); p=(prefix+'/'+name).strip('/')
                      rows.append({'id':item.get('id'),'name':name,'kind':kind,'path':p,'download':(item.get('links') or {}).get('download')})
                      if kind=='folder':
                          u=(rel.get('files') or {}).get('links',{}).get('related',{}).get('href')
                          if u: walk(u,p)
                  url=(j.get('links') or {}).get('next')
          walk('https://api.osf.io/v2/nodes/66gf4/files/osfstorage/')
          pathlib.Path('manifest').mkdir(exist_ok=True)
          pathlib.Path('manifest/manifest.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'n':len(rows),'experiment5':[r['path'] for r in rows if 'experiment 5' in r['path'].lower() or 'experiment5' in r['path'].lower() or 'exp 5' in r['path'].lower()]},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: gaesser-66gf4-manifest
          path: manifest/
          retention-days: 1
