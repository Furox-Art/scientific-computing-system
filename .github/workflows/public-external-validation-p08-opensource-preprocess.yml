name: Public external validation P08 AFNI ANTs tedana sensitivity V2 resource-safe

on:
  push:
    branches:
      - external-validation-public-runner-20260918
    paths:
      - '.github/workflows/public-external-validation-p08-opensource-preprocess.yml'
      - 'tools/public_external_validation_p08_opensource_preprocess.py'
      - 'tools/public_external_validation_p08_sensitivity_prepare.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        participant: [sub-Bubbles, sub-Buttercup, sub-PILOT02]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-validation-public-runner-20260918

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             requests             'tedana==26.0.3'             'templateflow==25.1.2'
          python - <<'PY'
          import tedana, templateflow
          assert tedana.__version__ == "26.0.3", tedana.__version__
          print("tedana", tedana.__version__)
          print("templateflow", templateflow.__version__)
          PY

      - name: Install pinned ANTs 2.6.5 binary
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ANTsX/ANTs/releases/download/v2.6.5/ants-2.6.5-ubuntu-24.04-X64-gcc.zip'
          expected='9f6a2c8881d6c94ea17171c0502e55cb898ad9afd50e4e23fde9a8c0997aa04b'
          curl -L --retry 4 --retry-delay 3 -o /tmp/ants.zip "$url"
          echo "$expected  /tmp/ants.zip" | sha256sum -c -
          unzip -q /tmp/ants.zip -d /tmp/ants
          rm -f /tmp/ants.zip
          bindir="$(find /tmp/ants -type f -name antsRegistration -printf '%h\n' | head -n1)"
          test -n "$bindir"
          libdir="$(dirname "$bindir")/lib"
          test -d "$libdir"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$libdir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$bindir/antsRegistration" --version | head -n 3

      - name: Pull exact AFNI image
        shell: bash
        run: |
          set -euo pipefail
          image='afni/afni_make_build@sha256:c8365868751116f1ef2d0811e8a4dd2df58a689da457c74ea07fedb0e11dc0d6'
          docker pull "$image"
          docker run --rm "$image" afni -ver | head -n 6

      - name: Record runner resources
        shell: bash
        run: |
          set -euo pipefail
          df -h
          free -h
          nproc
          docker system df

      - name: Reconstruct exact frozen participant BIDS subset
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_external_validation_p08_sensitivity_prepare.py             --participant "${{ matrix.participant }}"             --root .public-runner/p08/opensource-v2

      - name: Run AFNI + tedana + ANTs open-source sensitivity preprocessing
        id: preprocess
        shell: bash
        run: |
          set +e
          python tools/public_external_validation_p08_opensource_preprocess.py             --participant "${{ matrix.participant }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show compact result
        if: always()
        shell: bash
        run: |
          p="${{ matrix.participant }}"
          cat ".public-runner/p08/opensource-v2/$p/opensource_preprocessing_result.json" || true

      - name: Upload compact preprocessing provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-opensource-v2-preprocessing-provenance-${{ matrix.participant }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/input_reconstruction.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing.log
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_0GenericAffine.mat
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_1Warp.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/ants/T1_to_MNI_Warped.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/*/results/*.1D
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/*/results/QC_*/

      - name: Upload GLM-relevant open-source derivatives
        if: steps.preprocess.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: public-p08-opensource-v2-preprocessed-${{ matrix.participant }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/mni/*space-MNI152NLin2009cAsym*_desc-optcom_bold.nii.gz
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/tedana/*/run-*/t2smap/*
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/bids/sub-*/ses-*/func/*task-SORPF*_events.tsv
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/afni/*/results/*.1D
            .public-runner/p08/opensource-v2/${{ matrix.participant }}/opensource_preprocessing_result.json

      - name: Fail if preprocessing failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.preprocess.outputs.exit_code }}" = "0"
