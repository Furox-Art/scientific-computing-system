name: Public external validation P08 V2 run-recovery merge gate

on:
  workflow_run:
    workflows:
      - Public external validation P08 V2 run-sharded recovery
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  gate-and-dispatch:
    if: >-
      github.event.workflow_run.id == 35413974837 &&
      github.event.workflow_run.head_sha == '9b5ed86b6c9df5ea9e0babaeb051563be7ffad00' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact eight run shards and sixteen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/35413974837/jobs?filter=latest&per_page=100" > /tmp/jobs.json
          gh api "repos/$GH_REPO/actions/runs/35413974837/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json
          specs=[
            ('sub-Bubbles','ses-01',1),('sub-Bubbles','ses-01',2),
            ('sub-Bubbles','ses-04',1),('sub-Bubbles','ses-04',2),
            ('sub-Buttercup','ses-04',1),('sub-Buttercup','ses-04',2),
            ('sub-Buttercup','ses-05',1),('sub-Buttercup','ses-05',2),
          ]
          expected_jobs={f'run-shard ({p}, {s}, {r})' for p,s,r in specs}
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          got={j['name']:j.get('conclusion') for j in jobs if j['name'] in expected_jobs}
          if set(got)!=expected_jobs or any(v!='success' for v in got.values()):
              raise SystemExit(f'run-shard jobs not eligible: {got}')
          names={a['name'] for a in json.load(open('/tmp/artifacts.json'))['artifacts'] if not a.get('expired')}
          required=set()
          for p,s,r in specs:
              required.add(f'public-p08-v2-run-recovery-preprocessed-{p}-{s}-run-{r}')
              required.add(f'public-p08-v2-run-recovery-provenance-{p}-{s}-run-{r}')
          missing=sorted(required-names)
          if missing: raise SystemExit(f'missing run-recovery artifacts: {missing}')
          print(json.dumps({'jobs':got,'artifacts':sorted(required)},indent=2))
          PY

      - name: Dispatch run-recovery participant merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Furox-Art/scientific-computing-system
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GH_REPO/actions/workflows/public-external-validation-p08-v2-run-recovery-merge.yml/dispatches"             -f ref='external-validation-public-runner-20260918'             -f "inputs[run_shard_run_id]=35413974837"
          echo 'Run-recovery participant merge dispatch accepted.'
