name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CITATION.cff'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default-deny. Every job below opts in to exactly the scopes it needs; the
# workflow-level default is `contents: read` so a job that forgets to declare
# permissions cannot escalate by accident.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,dev,docs,pandas,plot]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Format check with Ruff
        run: ruff format --check .
      - name: Type check with Mypy (src)
        run: mypy src/
      - name: Type check with Mypy (tests)
        run: mypy tests/
      - name: Run tests with pytest
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest tests/ --cov=cds --cov-branch --cov-report=xml --cov-report=term
          else
            pytest tests/ --cov=cds --cov-branch --cov-report=term --no-cov-on-fail
          fi
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build documentation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: mkdocs build --strict

  audit:
    name: lock-file audit on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      # The runtime lock is intentionally empty (zero runtime dependencies), so
      # this command resolves nothing. It is kept as an explicit assertion that
      # the file stays empty: if a dependency is ever added to pyproject.toml
      # without regenerating the lock, pip-compile drift becomes visible here.
      - name: Audit runtime lock
        run: pip-audit -r requirements.lock --strict
      - name: Audit dev/docs/test lock
        run: pip-audit -r requirements-dev.lock --strict

  resolved-audit:
    name: resolved CI environment audit on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the exact reference-CI dependency set
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,dev,docs,pandas,plot]" pip-audit
      - name: Audit the actually installed environment
        run: |
          # The project itself may be a new, not-yet-published release candidate,
          # so exclude only the local root distribution and let pip-audit evaluate
          # the resolved third-party dependencies instead of querying PyPI for
          # the unpublished project version.
          python -m pip freeze --exclude scientific-computing-system > resolved-ci-environment.txt
          pip-audit -r resolved-ci-environment.txt --strict
      - name: Record resolved environment for diagnostics
        run: sort resolved-ci-environment.txt -o resolved-ci-environment.txt

  property-tests:
    name: property tests on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[property,test,dev]"
      - name: Type check with Mypy (property suite)
        run: mypy --strict tests/test_property_invariants.py tests/test_special_invariants.py
      - name: Run property-based tests
        run: pytest tests/test_property_invariants.py tests/test_special_invariants.py -v

  ml-reference:
    name: ML reference parity on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install package (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify estimators against frozen scikit-learn reference values
        run: python scripts/verify_ml_reference.py

  pre-commit:
    name: pre-commit on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  minimal-deps:
    name: minimal-deps coverage on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install base extras only
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,dev]"
      - name: Run tests and enforce core coverage at 100%
        shell: bash
        run: |
          set -e
          coverage run \
            --branch \
            --omit="*/cds/data_analysis/pandas_io.py,*/cds/plot/*" \
            -m pytest tests/
          coverage report --fail-under=100 --show-missing

  optional_audit:
    name: scientific/io extras audit and real backend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install scientific and I/O extras with audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit ".[test,scientific,io]"
          pip check
      - name: Audit resolved scientific and I/O environment
        run: |
          python -m pip freeze --exclude scientific-computing-system > /tmp/scientific-io-resolved.txt
          pip-audit -r /tmp/scientific-io-resolved.txt --strict
      - name: Exercise real HDF5 and NetCDF pipelines
        run: pytest tests/test_data_io_optional_backends.py -v

  version_discipline:
    name: synchronized monotonic package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history plus the base ref: the discipline diff must be taken
          # against the PR merge-base, never HEAD^1 (see the script docstring).
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Resolve the comparison base (merge-base, never HEAD^1)
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # `HEAD^1` is only correct for a single-commit update. For a
          # multi-commit push or a rebase merge it resolves to the previous
          # commit of the same branch, so the diff would cover only the tip and a
          # package change made in an earlier commit would pass unbumped.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1000 origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            # On push, `github.event.before` is the tip the branch pointed at
            # before this push, which is the true comparison base.
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          if [ -z "$base" ]; then
            echo "::error::Could not resolve a comparison base for the version-discipline diff."
            exit 1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing against $base ($BASE_REF)"
      # The previous invocation was:
      #     python scripts/check_version_discipline.py --base-ref HEAD^1
      # `HEAD^1` is the parent of the checked-out commit, which under a rebase
      # merge (and for any multi-commit push inspected at its tip) is the
      # previous commit of the *same branch*. The diff then covered only the tip,
      # so a PR could change `src/cds/` in one commit, add an unrelated follow-up
      # commit, and pass this gate with no version bump. The base is now resolved
      # to the PR merge-base above.
      - name: Reject source/version/citation drift
        run: python scripts/check_version_discipline.py --base-ref "${{ steps.base.outputs.ref }}"
      - name: Reject version metadata lockstep drift
        run: python scripts/check_version_lockstep.py
      # The release toolchain must stay pinned, and the twine pin must stay able
      # to validate the Metadata-Version the build backend actually emits --
      # twine<=6.2.0 overrides packaging's list at import time and rejects valid
      # artifacts with `'2.5' is not a valid metadata version`.
      #
      # GITHUB_TOKEN is passed so the advisory upstream checks authenticate.
      # Unauthenticated GitHub API calls are capped at 60/hour, which is easy to
      # exceed and fails in a way that looks like success: a sibling guard
      # "verified" pins under rate limiting and silently verified nothing.
      # Fast, offline, workflow-shape gate: pins and `twine check --strict` usage.
      # The authoritative run, including the twine/Metadata-Version compatibility
      # check, is in the `packaging` job below -- the only job that has built
      # artifacts to read the emitted Metadata-Version from.
      - name: Reject unpinned release toolchain
        run: python scripts/check_release_toolchain.py --skip-network
      # The provenance prose asserts, per registry, whether the published
      # release carries a build attestation. That claim was originally written
      # from memory and nothing checked it, so it could have kept being
      # asserted after a release changed the answer. This runs the committed
      # guard (`docs/checks/verify_provenance_claims.py`) against the live
      # registries and fails if the prose contradicts them.
      #
      # Placed here rather than in a new job on purpose: this job already owns
      # release-metadata verification and already sits in the required `CI`
      # aggregate, so this strengthens an existing gate instead of adding a
      # required check that would need a ruleset change. `permissions:
      # contents: read` above is sufficient -- the guard only reads PyPI and npm,
      # never the GitHub API, so no token is needed.
      #
      # `--strict-network` is deliberately NOT set: a registry outage is
      # reported as UNKNOWN and the run passes with a NOTICE, because a required
      # gate that fails on a DNS blip teaches people to re-run it rather than
      # read it. A false claim still fails. The unit test
      # (`tests/test_provenance_claims.py`) is the deterministic gate and needs
      # no network at all.
      #
      # The version is read from `pyproject.toml` rather than hardcoded: a
      # literal here would go stale at the next release, which is the same class
      # of stale-constant bug this step exists to catch. A version that has not
      # shipped yet is reported as unverifiable rather than "unattested", so a
      # bump PR is not blocked by asking about a release that does not exist.
      - name: Reject provenance claims that contradict the live registries
        run: >-
          python docs/checks/verify_provenance_claims.py
          --version "$(python -c 'import tomllib, pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          ["project"]["version"])')"

  packaging:
    name: built wheel and sdist contents on Linux with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the hash-locked build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: -r requirements-build.lock
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: Assert declared metadata matches the built artifacts
        run: python scripts/check_version_lockstep.py --dist-dir dist
      - name: Assert wheel and sdist contents
        run: python scripts/check_distribution_contents.py dist
      # Read the Metadata-Version out of the artifacts just built and prove the
      # pinned twine can validate it. twine<=6.2.0 overrides packaging's
      # metadata-version list at import time and rejects a valid artifact with
      # `'2.5' is not a valid metadata version`; a sibling release failed that
      # way with nothing wrong with the package.
      #
      # GITHUB_TOKEN is passed so the advisory upstream checks authenticate.
      # Unauthenticated GitHub API calls are capped at 60/hour, and under rate
      # limiting a pin check can silently verify nothing while reporting success.
      - name: Assert the pinned twine can validate the built metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_toolchain.py --dist-dir dist
      # A source distribution whose own test suite cannot pass is not a source
      # distribution. 13 release-contract tests used to fail here because
      # `.github/workflows` was missing from the sdist; this step is what keeps
      # that regression from returning unnoticed.
      - name: Run the test suite from the unpacked sdist
        run: |
          set -euo pipefail
          python -m pip install ".[test]"
          mkdir -p /tmp/sdist-check
          tar -xzf dist/scientific_computing_system-*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/scientific_computing_system-*
          pytest tests/ --no-cov -q

  npm-contract:
    name: npm launcher contract on Linux with Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      # `node --check` runs standalone here as well as via the npm `pretest`
      # hook: the shipped launcher previously could not be parsed at all, and
      # nothing in CI ever invoked Node.
      - name: Syntax-check the launcher and the bin shim
        run: |
          node --check index.js
          node --check bin/scs.js
      - name: Run the npm entry-point contract suite
        run: npm test
      # NOTE: there is deliberately no tarball/publish step here. npm publishing
      # was disabled by explicit product decision ("npm is no longer published",
      # main @ 52717c5): `npm-publish.yml` is a no-op and `package.json` is
      # private. This job guards the launcher files that remain in the
      # repository -- nothing in it may upload to a registry.
      - name: Verify the launcher forwards to the real cds CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          output="$(node index.js --version)"
          echo "$output"
          case "$output" in
            *"$(python -c 'import cds; print(cds.__version__)')"*) ;;
            *) echo "::error::launcher did not forward to the installed cds CLI"; exit 1 ;;
          esac
      - name: Verify the launcher propagates a failing exit status
        run: |
          set -euo pipefail
          # A non-zero child status must not be reported as success, otherwise
          # `scs` would lie about failed scientific runs.
          set +e
          node index.js integrate "x^" --a 0 --b 1 -n 4 >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::launcher swallowed a non-zero child exit status"
            exit 1
          fi
          echo "launcher propagated exit status $status as expected"

  CI:
    name: CI
    if: always()
    needs:
      [
        test,
        audit,
        resolved-audit,
        optional_audit,
        version_discipline,
        property-tests,
        pre-commit,
        minimal-deps,
        ml-reference,
        packaging,
        npm-contract,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Report overall result
        shell: bash
        run: |
          set -euo pipefail
          echo "test=${{ needs.test.result }}"
          echo "lock-audit=${{ needs.audit.result }}"
          echo "resolved-audit=${{ needs.resolved-audit.result }}"
          echo "optional_audit=${{ needs.optional_audit.result }}"
          echo "version_discipline=${{ needs.version_discipline.result }}"
          echo "property-tests=${{ needs.property-tests.result }}"
          echo "pre-commit=${{ needs.pre-commit.result }}"
          echo "minimal-deps=${{ needs.minimal-deps.result }}"
          echo "ml-reference=${{ needs.ml-reference.result }}"
          echo "packaging=${{ needs.packaging.result }}"
          echo "npm-contract=${{ needs.npm-contract.result }}"
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.resolved-audit.result }}" \
            "${{ needs.optional_audit.result }}" \
            "${{ needs.version_discipline.result }}" \
            "${{ needs.property-tests.result }}" \
            "${{ needs.pre-commit.result }}" \
            "${{ needs.minimal-deps.result }}" \
            "${{ needs.ml-reference.result }}" \
            "${{ needs.packaging.result }}" \
            "${{ needs.npm-contract.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more required jobs did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded."

  # gh-pages deployment depends on the AGGREGATE `CI` gate, not on the `test`
  # matrix alone. It previously needed only `[test]`, so a push to main could
  # publish documentation derived from a run whose audit, version-discipline,
  # packaging or npm gates had all failed. `if: always()` on the aggregate job
  # means it always reports; the dependency here is what makes staleness
  # impossible.
  deploy-docs:
    name: Deploy docs to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.CI.result == 'success'
    needs: [CI]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"
      # Rebuild strictly before publishing so a docs regression fails the job
      # instead of being deployed and discovered on the live site.
      - name: Verify the documentation builds strictly
        run: mkdocs build --strict
      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdocs gh-deploy --force --no-history
